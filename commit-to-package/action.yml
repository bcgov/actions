name: 'Workflow Walker — Commit to Package'
description: 'Forensic history traversal to resolve stable image SHAs from high-order repositories.'
branding:
  icon: search
  color: blue

inputs:
  images:
    description: 'Component to repo mapping (e.g. "frontend=ghcr.io/vexilon-web")'
    required: true
  max_depth:
    description: 'Max commits to walk back'
    default: '100'
  debug:
    description: 'Enable debug logging'
    default: 'false'
  token:
    description: 'GitHub token (GH_TOKEN or PAT)'
    default: ${{ github.token }}
  repository:
    description: 'Target repository to investigate (e.g. owner/repo)'
    default: ${{ github.repository }}
  dir:
    description: 'Directory containing the git repository'
    default: '.'

outputs:
  bundle:
    description: 'JSON object mapping components to verified SHAs'
    value: ${{ steps.walk.outputs.bundle }}

runs:
  using: 'composite'
  steps:
    - id: walk
      shell: bash
      env:
        INPUT_IMAGES: ${{ inputs.images }}
        INPUT_MAX_DEPTH: ${{ inputs.max_depth }}
        INPUT_DEBUG: ${{ inputs.debug }}
        INPUT_DIR: ${{ inputs.dir }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash ${{ github.action_path }}/action.sh
