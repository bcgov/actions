name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  fork-gate:
    name: Fork Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Not a Fork PR
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::PRs from external forks are not allowed on this repository. Maintainers must check out a local branch to run CI validation."
          exit 1

  path-filter:
    name: Path Filter
    needs: fork-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      actionlint: ${{ steps.filter.outputs['actionlint'] }}
      builder-ghcr: ${{ steps.filter.outputs['builder-ghcr'] }}
      diff-triggers: ${{ steps.filter.outputs['diff-triggers'] }}
      get-pr: ${{ steps.filter.outputs['get-pr'] }}
      image-tracker: ${{ steps.filter.outputs['image-tracker'] }}
      pr-description-add: ${{ steps.filter.outputs['pr-description-add'] }}
      sysdig-monitor: ${{ steps.filter.outputs['sysdig-monitor'] }}
      test-and-analyse: ${{ steps.filter.outputs['test-and-analyse'] }}
      workflow-notifier: ${{ steps.filter.outputs['workflow-notifier'] }}
      workflows: ${{ steps.filter.outputs['workflows'] }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter Changed Paths
        id: filter
        uses: ./diff-triggers
        with:
          skip_checkout: 'true'
          filters: |
            actionlint:
              - 'actionlint/**'
            builder-ghcr:
              - 'builder-ghcr/**'
              - '.github/workflows/test-builder-ghcr.yml'
            diff-triggers:
              - 'diff-triggers/**'
              - '.github/workflows/test-diff-triggers.yml'
            get-pr:
              - 'get-pr/**'
              - '.github/workflows/test-get-pr.yml'
            image-tracker:
              - 'image-tracker/**'
              - '.github/workflows/test-image-tracker.yml'
            pr-description-add:
              - 'pr-description-add/**'
              - '.github/workflows/test-pr-description-add.yml'
            sysdig-monitor:
              - 'sysdig-monitor/**'
              - '.github/workflows/test-sysdig-monitor.yml'
            test-and-analyse:
              - 'test-and-analyse/**'
              - '.github/workflows/test-test-and-analyse.yml'
            workflow-notifier:
              - 'workflow-notifier/**'
              - '.github/workflows/test-notifier.yml'
            workflows:
              - '.github/workflows/**'

  # Fail-closed: any .github/workflows/** change runs all tests so CI graph
  # edits cannot green-merge with every suite skipped.
  test-builder-ghcr:
    name: Test Builder GHCR
    needs: [fork-gate, path-filter]
    if: needs.path-filter.outputs.builder-ghcr == 'true' || needs.path-filter.outputs.workflows == 'true'
    uses: ./.github/workflows/test-builder-ghcr.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  test-diff-triggers:
    name: Test Diff Triggers
    needs: [fork-gate, path-filter]
    if: needs.path-filter.outputs.diff-triggers == 'true' || needs.path-filter.outputs.workflows == 'true'
    uses: ./.github/workflows/test-diff-triggers.yml
    permissions:
      contents: read

  test-get-pr:
    name: Test Get PR
    needs: [fork-gate, path-filter]
    if: needs.path-filter.outputs.get-pr == 'true' || needs.path-filter.outputs.workflows == 'true'
    uses: ./.github/workflows/test-get-pr.yml
    permissions:
      contents: read

  test-image-tracker:
    name: Test Image Tracker
    needs: [fork-gate, path-filter]
    if: needs.path-filter.outputs.image-tracker == 'true' || needs.path-filter.outputs.workflows == 'true'
    uses: ./.github/workflows/test-image-tracker.yml
    permissions:
      contents: read
      packages: read
      pull-requests: read

  test-notifier:
    name: Test Notifier
    needs: [fork-gate, path-filter]
    if: needs.path-filter.outputs.workflow-notifier == 'true' || needs.path-filter.outputs.workflows == 'true'
    uses: ./.github/workflows/test-notifier.yml
    permissions:
      contents: read
      issues: write

  test-pr-description-add:
    name: Test PR Description Add
    needs: [fork-gate, path-filter]
    if: needs.path-filter.outputs.pr-description-add == 'true' || needs.path-filter.outputs.workflows == 'true'
    uses: ./.github/workflows/test-pr-description-add.yml
    permissions:
      contents: read
      pull-requests: write

  test-sysdig-monitor:
    name: Test Sysdig Monitor
    needs: [fork-gate, path-filter]
    if: needs.path-filter.outputs.sysdig-monitor == 'true' || needs.path-filter.outputs.workflows == 'true'
    uses: ./.github/workflows/test-sysdig-monitor.yml
    permissions:
      contents: read

  test-test-and-analyse:
    name: Test Test and Analyse
    needs: [fork-gate, path-filter]
    if: needs.path-filter.outputs.test-and-analyse == 'true' || needs.path-filter.outputs.workflows == 'true'
    uses: ./.github/workflows/test-test-and-analyse.yml
    permissions:
      contents: read
      pull-requests: write

  results:
    name: PR Results
    needs:
      - fork-gate
      - path-filter
      - test-builder-ghcr
      - test-diff-triggers
      - test-get-pr
      - test-image-tracker
      - test-notifier
      - test-pr-description-add
      - test-sysdig-monitor
      - test-test-and-analyse
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check Results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "CI validation failed."
          exit 1
      - name: Success
        run: echo "CI validation passed."
