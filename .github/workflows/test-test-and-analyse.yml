name: Test Test and Analyse

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'test-and-analyse/**'
      - '.github/workflows/test-test-and-analyse.yml'
  workflow_dispatch:

concurrency:
  # Unique per suite: github.workflow is the *caller* name (CI), so sharing
  # that key across reusable workflows cancels sibling suites mid-run.
  group: test-test-and-analyse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

# Sonar optional: sonar_token is passed only on backend-triggered when SONAR_TOKEN
# (or legacy SONAR_TOKEN_FRONTEND fallback) is configured. require_sonar stays false.

jobs:
  tests:
    name: Test Action
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        name: [backend-triggered, backend-not-triggered, frontend-basic, frontend-no-triggers, waste-frontend, java-basic, fom-autodiscover]
        include:
          - name: backend-triggered
            dir: backend
            triggers: ""
            expected_triggered: true
            repository: bcgov/quickstart-openshift
            test_command: npm install --no-package-lock && npm run test:cov
            exercise_sonar: true
          - name: backend-not-triggered
            dir: backend
            triggers: "('not-existent-path/')"
            expected_triggered: false
            repository: bcgov/quickstart-openshift
            test_command: npm install --no-package-lock && npm run test:cov
          - name: frontend-basic
            dir: frontend
            triggers: ""
            expected_triggered: true
            repository: bcgov/quickstart-openshift
            test_command: npm install --no-package-lock && npm run test:cov
          - name: frontend-no-triggers
            dir: frontend
            expected_triggered: true
            dep_scan: off
            test_command: npm install --no-package-lock && npm run test:cov
            repository: bcgov/quickstart-openshift
          - name: waste-frontend
            dir: frontend
            expected_triggered: true
            dep_scan: warn
            test_command: echo "Good enough for testing knip!"
            repository: bcgov/nr-waste-plus
          - name: java-basic
            dir: backend
            language: java
            java_version: "17"
            triggers: ""
            expected_triggered: true
            repository: bcgov/nr-forest-client
            # No Sonar in this cell: repo token scope covers bcgov/actions Node CI only until a Java project token exists.
            test_command: timeout 10m mvn -B verify -P all-tests -DskipTests
            cache: "none" # Explicitly disable cache
          - name: fom-autodiscover
            dir: ""
            triggers: ""
            expected_triggered: true
            repository: bcgov/nr-fom
            test_command: echo "Testing autodiscover on nr-fom"
            expected_config: ".github/knip.json"
            cache: "none"
    steps:
      # 1. Checkout the Action (this repo) at the root
      - name: Checkout Action
        uses: actions/checkout@v7

      # 2. Checkout the Test Project manually to avoid collisions
      - name: Checkout Test Project
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          path: test-project
          fetch-depth: 0

      # 3. Use the local action (./test-and-analyse) to analyze the project
      - id: action
        uses: ./test-and-analyse
        with:
          skip_checkout: "true"
          commands: |
            ${{ matrix.test_command }}
          # Point the action to the subfolder where the project lives
          dir: test-project/${{ matrix.dir }}
          node_version: "24"
          language: ${{ matrix.language || 'node' }}
          java_version: ${{ matrix.java_version || '21' }}
          repository: ${{ matrix.repository }}
          triggers: ${{ matrix.triggers }}
          sonar_token: ${{ matrix.exercise_sonar == true && (secrets.SONAR_TOKEN || secrets.SONAR_TOKEN_FRONTEND) || '' }}
          require_sonar: 'false'
          cache: ${{ matrix.cache || 'npm' }}

      - name: Verify trigger behavior
        run: |
          echo "🔍 Verifying trigger behavior for ${{ matrix.name }}"
          expected="${{ matrix.expected_triggered }}"
          # diff-triggers runs only on pull_request; on push/workflow_dispatch the action always reports triggered=true
          if [ "${{ matrix.name }}" = "backend-not-triggered" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            expected="true"
          fi
          actual="${{ steps.action.outputs.triggered }}"
          if [ "$actual" != "$expected" ]; then
            echo "❌ ${{ matrix.name }}: expected triggered=$expected, got $actual"
            exit 1
          fi
          echo "✅ ${{ matrix.name }}: expected triggered=$expected, got $actual"

      - name: Verify discovered knip config
        if: matrix.expected_config != ''
        run: |
          echo "🔍 Verifying discovered Knip config for ${{ matrix.name }}"
          CONFIG_OUT="${{ steps.action.outputs.knip_config }}"
          EXPECTED_SUFFIX="${{ matrix.expected_config }}"
          if [[ "$CONFIG_OUT" != *"$EXPECTED_SUFFIX" ]]; then
            echo "❌ Expected knip_config output to end with '$EXPECTED_SUFFIX', got '$CONFIG_OUT'"
            exit 1
          fi
          echo "✅ Discovered Knip config correctly matched: $CONFIG_OUT"
