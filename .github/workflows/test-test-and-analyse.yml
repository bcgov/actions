name: Test Test and Analyse

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint (ShellCheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run ShellCheck
        run: |
          find . -name "*.sh" -print0 | xargs -0 shellcheck -s bash || true

  unit:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run Unit Tests
        run: |
          bash test-and-analyse/tests/unit.sh

  validate-structure:
    name: Validate Action Structure
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Check action directory exists
        run: |
          if [ ! -d "test-and-analyse" ]; then
            echo "::error::test-and-analyse directory not found"
            exit 1
          fi
          echo "✅ test-and-analyse directory exists"

      - name: List action contents
        run: |
          echo "Contents of test-and-analyse:"
          ls -la test-and-analyse/

  note-dependencies:
    name: Note Dependencies
    needs: validate-structure
    runs-on: ubuntu-latest
    steps:
      - name: Show Note
        run: |
          echo "✅ test-and-analyse action migrated from bcgov/action-test-and-analyse"
          echo ""
          echo "Files available:"
          echo "  - action.yml"
          echo "  - package.json"
          echo "  - package-lock.json"
          echo "  - .knip.json"
          echo "  - LICENSE"
          echo ""
          echo "Note: action.sh was not present in original repo (composite action uses action.yml directly)"
          echo ""
          echo "✅ Validation structure complete"