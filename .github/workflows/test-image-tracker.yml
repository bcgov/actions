name: Test Image Tracker

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint (ShellCheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run ShellCheck
        run: |
          find . -name "*.sh" -print0 | xargs -0 shellcheck -s bash

  unit:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run Unit Tests
        run: |
          bash image-tracker/tests/unit.sh

  validate:
    name: Validate Action Definition
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Validate action.yml exists
        run: |
          if [ ! -f "image-tracker/action.yml" ]; then
            echo "::error::image-tracker/action.yml not found"
            exit 1
          fi
          echo "✅ action.yml exists"

      - name: Validate YAML syntax
        run: |
          pip install pyyaml -q
          python3 -c "import yaml; yaml.safe_load(open('image-tracker/action.yml'))"
          echo "✅ YAML syntax valid"

  functional:
    name: Functional Tests (Real-World)
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6

      - name: Checkout Quickstart
        uses: actions/checkout@v6
        with:
          repository: bcgov/quickstart-openshift
          path: quickstart-repo
          fetch-depth: 100

      - name: Resolve Quickstart packages
        id: quickstart
        uses: ./image-tracker
        with:
          package: frontend, backend, quickstart-openshift
          repository: bcgov/quickstart-openshift
          dir: quickstart-repo
          token: ${{ github.token }}

      - name: Verify resolution
        run: |
          PACKAGES='${{ steps.quickstart.outputs.packages }}'
          echo "Packages: $PACKAGES"
          echo "$PACKAGES" | jq -e '.frontend' > /dev/null \
            || { echo "::error::Frontend resolution failed"; exit 1; }
          echo "$PACKAGES" | jq -e '.backend' > /dev/null \
            || { echo "::error::Backend resolution failed"; exit 1; }
          echo "$PACKAGES" | jq -e '."quickstart-openshift"' > /dev/null \
            || { echo "::error::Base repo resolution failed"; exit 1; }
          echo "✅ Passed: All packages resolved"

      - name: Test Inventory Audit
        id: inventory
        uses: ./image-tracker
        with:
          package: frontend
          repository: bcgov/quickstart-openshift
          dir: quickstart-repo
          inventory_depth: 5
          token: ${{ github.token }}

      - name: Verify Inventory Output
        run: |
          INVENTORY='${{ steps.inventory.outputs.inventory }}'
          echo "Inventory size: $(echo "$INVENTORY" | jq '. | length')"
          if [[ $(echo "$INVENTORY" | jq '. | length') -eq 0 ]]; then
            echo "::error::Inventory is empty"; exit 1;
          fi
          echo "✅ Passed: Inventory populated"

      - name: Test PR Resolver (Dumb Walk)
        id: pr_resolver
        uses: ./image-tracker
        with:
          repository: bcgov/quickstart-openshift
          dir: quickstart-repo
          max_depth: 10
          token: ${{ github.token }}

      - name: Verify PR Output
        run: |
          PR='${{ steps.pr_resolver.outputs.pr }}'
          echo "Resolved PR: $PR"
          if [[ -z "$PR" || "$PR" == "null" ]]; then
            echo "::error::PR resolution failed"; exit 1;
          fi
          echo "✅ Passed: PR #$PR resolved"
