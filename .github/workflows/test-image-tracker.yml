name: Test Image Tracker

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint (ShellCheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run ShellCheck
        run: |
          find . -name "*.sh" -print0 | xargs -0 shellcheck -s bash

  unit:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run Unit Tests
        run: bash image-tracker/tests/unit.sh

  validate:
    name: Validate Action Definition
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Validate action.yml
        run: |
          test -f image-tracker/action.yml
          pip install pyyaml -q
          python3 -c "import yaml; yaml.safe_load(open('image-tracker/action.yml'))"

  functional:
    name: Functional Tests (Real-World)
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include:
          - repo: MinionTech/vexilon
            package: agnav
          - repo: bcgov/quickstart-openshift
            package: frontend,backend,migrations
    env:
      TARGET_REPO: ${{ matrix.repo }}
      TARGET_PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v6

      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TARGET_REPO }}
          path: target
          fetch-depth: 0

      - name: Pick a known commit from published images
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find a recent tag on the target image, read its revision label from
          # the config blob, and expose (commit, expected manifest digest) as
          # step outputs. This is our ground truth: image-tracker must return
          # the same digest when asked to resolve this commit.
          set -euo pipefail
          lc_repo=$(echo "${TARGET_REPO}" | tr '[:upper:]' '[:lower:]')
          image_path="${lc_repo}/${TARGET_PACKAGE}"
          bearer=$(curl -sS -u "x:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${image_path}:pull" | jq -r '.token')

          # Skip helper tags (sigs, sboms, buildcache) and the 'latest' moving tag.
          tag=$(curl -sS -H "Authorization: Bearer ${bearer}" \
            "https://ghcr.io/v2/${image_path}/tags/list?n=50" \
            | jq -r '.tags[]' \
            | grep -Ev '^(buildcache|latest)$' \
            | grep -Ev '\.(sig|sbom|att)$' \
            | head -1)
          echo "Using tag: $tag"

          accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
          resp=$(curl -sS -i -H "Authorization: Bearer ${bearer}" -H "Accept: ${accept}" \
            "https://ghcr.io/v2/${image_path}/manifests/${tag}")
          body=$(printf '%s' "$resp" | awk 'BEGIN{p=0}/^\r?$/{p=1;next}p{print}')
          expected_digest=$(printf '%s' "$resp" \
            | awk 'BEGIN{IGNORECASE=1}/^docker-content-digest:/ {gsub(/\r/,""); print $2; exit}')
          mtype=$(printf '%s' "$body" | jq -r '.mediaType // empty')

          if [[ "$mtype" == *index* || "$mtype" == *manifest.list* ]]; then
            child=$(printf '%s' "$body" | jq -r '
              .manifests[]
              | select(.platform.architecture == "amd64" and (.platform.os // "") != "unknown")
              | .digest' | head -1)
            body=$(curl -sS -H "Authorization: Bearer ${bearer}" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${image_path}/manifests/${child}")
          fi
          config_digest=$(printf '%s' "$body" | jq -r '.config.digest')
          revision=$(curl -sSL -H "Authorization: Bearer ${bearer}" \
            "https://ghcr.io/v2/${image_path}/blobs/${config_digest}" \
            | jq -r '.config.Labels["org.opencontainers.image.revision"]')

          if [[ -z "$revision" || "$revision" == "null" ]]; then
            echo "::error::Selected tag $tag has no revision label; cannot use for test."
            exit 1
          fi

          echo "commit=${revision}"          >> "$GITHUB_OUTPUT"
          echo "expected=${expected_digest}" >> "$GITHUB_OUTPUT"
          echo "Ground truth: commit=${revision}, expected_digest=${expected_digest}"

          # Ensure the commit is locally reachable for `git rev-parse` inside
          # image-tracker. Commits on branches/PRs aren't always fetched.
          ( cd target && git fetch --quiet origin "${revision}" || true )

      - name: Resolve via image-tracker
        id: tracker
        uses: ./image-tracker
        with:
          package: ${{ env.TARGET_PACKAGE }}
          repository: ${{ env.TARGET_REPO }}
          dir: target
          revision: ${{ steps.pick.outputs.commit }}

      - name: Verify output
        run: |
          set -euo pipefail
          got_digest='${{ steps.tracker.outputs.digest }}'
          expected='${{ steps.pick.outputs.expected }}'
          got_image='${{ steps.tracker.outputs.image }}'
          got_images='${{ steps.tracker.outputs.images }}'

          echo "Got digest:  $got_digest"
          echo "Got image:   $got_image"
          echo "Got images:  $got_images"
          echo "Expected:    $expected"

          [[ "$got_digest" == "$expected" ]] \
            || { echo "::error::digest mismatch"; exit 1; }
          [[ "$got_image" == "ghcr.io/${TARGET_REPO}/${TARGET_PACKAGE}@$expected" ]] \
            || { echo "::error::image ref malformed or wrong"; exit 1; }
          echo "$got_images" | jq -e --arg k "${TARGET_PACKAGE}" '.[$k]' >/dev/null \
            || { echo "::error::images JSON missing ${TARGET_PACKAGE} key"; exit 1; }

          echo "✅ image-tracker returned the expected digest"
