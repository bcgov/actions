name: Test Image Tracker

on:
  workflow_call:
  pull_request:
    paths:
      - 'image-tracker/**'
      - '.github/workflows/test-image-tracker.yml'
      - '.tool-versions'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'image-tracker/**'
      - '.github/workflows/test-image-tracker.yml'
      - '.tool-versions'
  workflow_dispatch:

concurrency:
  # Unique per suite: github.workflow is the *caller* name (CI), so sharing
  # that key across reusable workflows cancels sibling suites mid-run.
  group: test-image-tracker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint (ShellCheck)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Run ShellCheck
        run: |
          find . -name "*.sh" -print0 | xargs -0 shellcheck -s bash

  unit:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Run Unit Tests
        run: bash image-tracker/tests/unit.sh

  validate:
    name: Validate Action Definition
    needs: unit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Validate action.yml
        run: |
          test -f image-tracker/action.yml
          pip install pyyaml -q
          python3 -c "import yaml; yaml.safe_load(open('image-tracker/action.yml'))"

  functional:
    name: Functional Tests (${{ matrix.repo }} / ${{ matrix.package }})
    needs: unit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: bcgov/quickstart-openshift
            package: frontend
          - repo: bcgov/quickstart-openshift
            package: backend
          - repo: miniontech/vexilon
            package: agnav
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          path: target
          fetch-depth: 0

      - id: discover
        name: Discover labeled image for package
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ matrix.repo }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          lc_repo=$(echo "${TARGET_REPO}" | tr '[:upper:]' '[:lower:]')
          image_path="${lc_repo}/${PACKAGE}"
          accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
          accept_m='application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'

          probe_tag() {
            local tag="$1" b="$2"
            local resp body mtype child cfg rev mdigest
            resp=$(curl -sS -i -H "Authorization: Bearer ${b}" -H "Accept: ${accept}" \
              "https://ghcr.io/v2/${image_path}/manifests/${tag}")
            mdigest=$(printf '%s' "$resp" \
              | awk 'BEGIN{IGNORECASE=1}/^docker-content-digest:/{gsub(/\r/,""); print $2; exit}')
            body=$(printf '%s' "$resp" | awk 'BEGIN{p=0}/^\r?$/{p=1;next}p{print}')
            mtype=$(printf '%s' "$body" | jq -r '.mediaType // empty')
            if [[ "$mtype" == *index* || "$mtype" == *manifest.list* ]]; then
              child=$(printf '%s' "$body" | jq -r '
                (.manifests[] | select(.platform.architecture=="amd64" and (.platform.os//"")!="unknown") | .digest),
                (.manifests[0].digest)' 2>/dev/null | head -1)
              body=$(curl -sS -H "Authorization: Bearer ${b}" -H "Accept: ${accept_m}" \
                "https://ghcr.io/v2/${image_path}/manifests/${child}" 2>/dev/null || true)
            fi
            cfg=$(printf '%s' "$body" | jq -r '.config.digest // empty')
            [[ -z "$cfg" ]] && return 0
            rev=$(curl -sSL -H "Authorization: Bearer ${b}" \
              "https://ghcr.io/v2/${image_path}/blobs/${cfg}" \
              | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' 2>/dev/null || true)
            [[ -z "$rev" || "$rev" == "null" ]] && return 0
            printf '%s\t%s' "$rev" "$mdigest"
          }

          bearer=$(curl -sS -u "x:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${image_path}:pull" | jq -r '.token')

          found_rev=""
          found_digest=""
          pr_num=""

          for cand in $(cd target && git rev-list --topo-order -n 20 HEAD); do
            short_sha="${cand:0:7}"
            pr_num=$(GH_TOKEN="$GH_TOKEN" gh api "/repos/${TARGET_REPO}/commits/${cand}/pulls" --jq 'if length > 0 then .[0].number else empty end' 2>/dev/null || true)

            result=$(probe_tag "sha-${short_sha}" "$bearer" || true)
            if [[ -z "$result" ]]; then
              result=$(probe_tag "sha-${cand}" "$bearer" || true)
            fi
            if [[ -z "$result" && -n "$pr_num" ]]; then
              result=$(probe_tag "pr-${pr_num}" "$bearer" || true)
            fi

            if [[ -n "$result" ]]; then
              found_rev="${result%%$'\t'*}"
              found_digest="${result##*$'\t'}"
              break
            fi
          done

          if [[ -z "$found_rev" ]]; then
            echo "::error::No labeled image found for ${PACKAGE} in ${TARGET_REPO}"
            exit 1
          fi

          (
            cd target
            git fetch --quiet origin "${found_rev}" 2>/dev/null || true
          )

          echo "Ground truth: pkg=${PACKAGE} commit=${found_rev} digest=${found_digest} pr=${pr_num}"
          {
            echo "revision=${found_rev}"
            echo "digest=${found_digest}"
            echo "pr=${pr_num}"
          } >> "$GITHUB_OUTPUT"

      - id: track
        name: Resolve via image-tracker action
        uses: $/image-tracker
        with:
          package: ${{ matrix.package }}
          revision: ${{ steps.discover.outputs.revision }}
          repository: ${{ matrix.repo }}
          dir: target
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify action outputs
        env:
          TARGET_REPO: ${{ matrix.repo }}
          PACKAGE: ${{ matrix.package }}
          EXPECTED_DIGEST: ${{ steps.discover.outputs.digest }}
          EXPECTED_PR: ${{ steps.discover.outputs.pr }}
          GOT_DIGEST: ${{ steps.track.outputs.digest }}
          GOT_IMAGE: ${{ steps.track.outputs.image }}
          GOT_IMAGES: ${{ steps.track.outputs.images }}
          GOT_PR: ${{ steps.track.outputs.pr }}
        run: |
          set -euo pipefail
          lc_repo=$(echo "$TARGET_REPO" | tr '[:upper:]' '[:lower:]')
          image_path="${lc_repo}/${PACKAGE}"

          echo "Got digest:  ${GOT_DIGEST}"
          echo "Got image:   ${GOT_IMAGE}"
          echo "Got images:  ${GOT_IMAGES}"
          echo "Got pr:      ${GOT_PR}"
          echo "Expected:    ${EXPECTED_DIGEST}"

          if [[ "$GOT_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo "::error::${PACKAGE}: digest mismatch: got ${GOT_DIGEST} expected ${EXPECTED_DIGEST}"
            exit 1
          fi
          if [[ "$GOT_IMAGE" != "ghcr.io/${image_path}@${EXPECTED_DIGEST}" ]]; then
            echo "::error::${PACKAGE}: image ref wrong: got ${GOT_IMAGE}"
            exit 1
          fi
          if ! echo "$GOT_IMAGES" | jq -e --arg k "$PACKAGE" '.[$k]' >/dev/null 2>&1; then
            echo "::error::${PACKAGE}: images JSON missing key ${PACKAGE}"
            exit 1
          fi
          if [[ -n "$EXPECTED_PR" && "$GOT_PR" != "$EXPECTED_PR" ]]; then
            echo "::error::${PACKAGE}: pr mismatch: got '${GOT_PR}' expected '${EXPECTED_PR}'"
            exit 1
          fi
          echo "✅ ${PACKAGE}: resolved correctly"
