name: Test Image Tracker

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint (ShellCheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run ShellCheck
        run: |
          find . -name "*.sh" -print0 | xargs -0 shellcheck -s bash

  unit:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run Unit Tests
        run: |
          bash image-tracker/tests/unit.sh

  validate:
    name: Validate Action Definition
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Validate action.yml exists
        run: |
          if [ ! -f "image-tracker/action.yml" ]; then
            echo "::error::image-tracker/action.yml not found"
            exit 1
          fi
          echo "✅ action.yml exists"

      - name: Validate YAML syntax
        run: |
          pip install pyyaml -q
          python3 -c "import yaml; yaml.safe_load(open('image-tracker/action.yml'))"
          echo "✅ YAML syntax valid"

  functional:
    name: Functional Tests (Real-World)
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6

      - name: Resolve vexilon package
        id: vexilon
        uses: ./image-tracker
        with:
          package: vexilon
          repository: DerekRoberts/vexilon
          ref: main
          token: ${{ github.token }}

      - name: Verify resolution
        run: |
          PACKAGES='${{ steps.vexilon.outputs.packages }}'
          echo "Packages: $PACKAGES"
          echo "$PACKAGES" | jq -e '.vexilon' > /dev/null \
            || { echo "::error::Resolution failed"; exit 1; }
          echo "✅ Passed: $(echo "$PACKAGES" | jq -r '.vexilon')"
