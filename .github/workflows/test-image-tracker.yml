name: Test Image Tracker

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint (ShellCheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run ShellCheck
        run: |
          find . -name "*.sh" -print0 | xargs -0 shellcheck -s bash

  unit:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run Unit Tests
        run: bash image-tracker/tests/unit.sh

  validate:
    name: Validate Action Definition
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Validate action.yml
        run: |
          test -f image-tracker/action.yml
          pip install pyyaml -q
          python3 -c "import yaml; yaml.safe_load(open('image-tracker/action.yml'))"

  functional:
    name: Functional Tests (Real-World)
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: MinionTech/vexilon
            package: agnav
          - repo: bcgov/quickstart-openshift
            package: frontend,backend
    env:
      TARGET_REPO: ${{ matrix.repo }}
      TARGET_PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v6

      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TARGET_REPO }}
          path: target
          fetch-depth: 0

      - name: Pick a known commit from published images
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find a recent tag on the target image, read its revision label from
          # the config blob, and expose (commit, expected manifest digest) as
          # step outputs. This is our ground truth: image-tracker must return
          # the same digest when asked to resolve this commit.
          set -euo pipefail
          lc_repo=$(echo "${TARGET_REPO}" | tr '[:upper:]' '[:lower:]')

          # Build the list of packages to probe.
          mapfile -t pkgs < <(echo "${TARGET_PACKAGE}" | tr ',' '\n' | tr -s '[:space:]' '\n' | grep -v '^$')
          first_pkg="${pkgs[0]}"
          accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
          accept_m='application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'

          # Helper: read org.opencontainers.image.revision from a GHCR image tag.
          get_revision() {
            local ipath="$1" tag="$2" b="$3"
            local resp body mtype child cfg rev
            resp=$(curl -sS -i -H "Authorization: Bearer ${b}" -H "Accept: ${accept}" \
              "https://ghcr.io/v2/${ipath}/manifests/${tag}")
            body=$(printf '%s' "$resp" | awk 'BEGIN{p=0}/^\r?$/{p=1;next}p{print}')
            mtype=$(printf '%s' "$body" | jq -r '.mediaType // empty')
            if [[ "$mtype" == *index* || "$mtype" == *manifest.list* ]]; then
              child=$(printf '%s' "$body" | jq -r '
                (.manifests[] | select(.platform.architecture == "amd64" and (.platform.os // "") != "unknown") | .digest),
                (.manifests[0].digest)' 2>/dev/null | head -1)
              body=$(curl -sS -H "Authorization: Bearer ${b}" -H "Accept: ${accept_m}" \
                "https://ghcr.io/v2/${ipath}/manifests/${child}" 2>/dev/null)
            fi
            cfg=$(printf '%s' "$body" | jq -r '.config.digest // empty')
            [[ -z "$cfg" ]] && return 1
            rev=$(curl -sSL -H "Authorization: Bearer ${b}" \
              "https://ghcr.io/v2/${ipath}/blobs/${cfg}" \
              | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty')
            printf '%s' "$rev"
          }

          # Scan tags on the first package. For each candidate revision, verify
          # that all other packages also have a labeled image for that commit.
          bearer=$(curl -sS -u "x:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${lc_repo}/${first_pkg}:pull" | jq -r '.token')

          tags=$(curl -sS -H "Authorization: Bearer ${bearer}" \
            "https://ghcr.io/v2/${lc_repo}/${first_pkg}/tags/list?n=100" \
            | jq -r '.tags[]' \
            | grep -Ev '^(buildcache|latest|prod)$' \
            | grep -Ev '\.(sig|sbom|att)$')
          if [[ -z "$tags" ]]; then
            echo "::error::No valid tags found on ${first_pkg} after filtering."
            exit 1
          fi

          found_revision=""
          found_digest=""
          while IFS= read -r tag; do
            rev=$(get_revision "${lc_repo}/${first_pkg}" "$tag" "$bearer" || true)
            [[ -z "$rev" || "$rev" == "null" ]] && continue

            # Check all other packages have an image for this revision.
            all_found=true
            for pkg in "${pkgs[@]:1}"; do
              b=$(curl -sS -u "x:${GH_TOKEN}" \
                "https://ghcr.io/token?scope=repository:${lc_repo}/${pkg}:pull" | jq -r '.token')
              # Scan up to 100 tags on each sibling package looking for this revision.
              pkg_tags=$(curl -sS -H "Authorization: Bearer ${b}" \
                "https://ghcr.io/v2/${lc_repo}/${pkg}/tags/list?n=100" \
                | jq -r '.tags[]' \
                | grep -Ev '^(buildcache|latest|prod)$' \
                | grep -Ev '\.(sig|sbom|att)$')
              pkg_found=false
              while IFS= read -r ptag; do
                prev=$(get_revision "${lc_repo}/${pkg}" "$ptag" "$b" || true)
                if [[ "$prev" == "$rev" ]]; then
                  pkg_found=true
                  break
                fi
              done <<< "$pkg_tags"
              if [[ "$pkg_found" == "false" ]]; then
                all_found=false
                break
              fi
            done

            if [[ "$all_found" == "true" ]]; then
              # Get the manifest digest for the first package at this tag.
              resp=$(curl -sS -i -H "Authorization: Bearer ${bearer}" -H "Accept: ${accept}" \
                "https://ghcr.io/v2/${lc_repo}/${first_pkg}/manifests/${tag}")
              found_digest=$(printf '%s' "$resp" \
                | awk 'BEGIN{IGNORECASE=1}/^docker-content-digest:/ {gsub(/\r/,""); print $2; exit}')
              found_revision="$rev"
              echo "Found commit present in all packages: ${rev} (tag ${tag} on ${first_pkg})"
              break
            fi
          done <<< "$tags"

          if [[ -z "$found_revision" ]]; then
            echo "::error::Could not find a commit with labeled images in all packages: ${TARGET_PACKAGE}"
            exit 1
          fi

          echo "commit=${found_revision}"   >> "$GITHUB_OUTPUT"
          echo "expected=${found_digest}"   >> "$GITHUB_OUTPUT"
          echo "Ground truth: commit=${found_revision}, expected_digest=${found_digest}"

          # Ensure the commit is locally reachable for git rev-parse inside image-tracker.
          ( cd target && git fetch --quiet origin "${found_revision}" || true )

      - name: Resolve via image-tracker
        id: tracker
        uses: ./image-tracker
        with:
          package: ${{ env.TARGET_PACKAGE }}
          repository: ${{ env.TARGET_REPO }}
          dir: target
          revision: ${{ steps.pick.outputs.commit }}

      - name: Verify output
        run: |
          set -euo pipefail
          got_digest='${{ steps.tracker.outputs.digest }}'
          expected='${{ steps.pick.outputs.expected }}'
          got_image='${{ steps.tracker.outputs.image }}'
          got_images='${{ steps.tracker.outputs.images }}'

          echo "Got digest:  $got_digest"
          echo "Got image:   $got_image"
          echo "Got images:  $got_images"
          echo "Expected:    $expected"

          lc_repo=$(echo "${TARGET_REPO}" | tr '[:upper:]' '[:lower:]')
          first_pkg=$(echo "${TARGET_PACKAGE}" | tr ',' '\n' | tr -s '[:space:]' '\n' | grep -v '^$' | head -1)

          [[ "$got_digest" == "$expected" ]] \
            || { echo "::error::digest mismatch: got $got_digest expected $expected"; exit 1; }
          [[ "$got_image" == "ghcr.io/${lc_repo}/${first_pkg}@$expected" ]] \
            || { echo "::error::image ref malformed or wrong: got $got_image"; exit 1; }
          echo "$got_images" | jq -e --arg k "${first_pkg}" '.[$k]' >/dev/null \
            || { echo "::error::images JSON missing ${first_pkg} key"; exit 1; }

          echo "✅ image-tracker returned the expected digest"
