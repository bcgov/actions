name: Verify Test & Analyse
on:
  pull_request:
    paths:
      - "test-and-analyse/**"
      - ".github/workflows/verify-test-and-analyse.yml"

jobs:
  test-matrix:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend-triggered
            dir: backend
            triggers: "('.')"
            expected_triggered: "true"
            dep_scan: error
            test_command: npm run test:cov
            repository: bcgov/quickstart-openshift
          - name: backend-not-triggered
            dir: backend
            triggers: "('backend/')"
            expected_triggered: "false"
            dep_scan: error
            test_command: npm run test:cov
            repository: bcgov/quickstart-openshift
          - name: frontend-basic
            dir: frontend
            triggers: "('.')"
            expected_triggered: "true"
            dep_scan: warn
            test_command: npm run test:cov
            repository: bcgov/quickstart-openshift
          - name: waste-plus-scan
            dir: frontend
            triggers: "('.')"
            expected_triggered: "true"
            dep_scan: warn
            test_command: echo "Testing Knip on Waste Plus"
            repository: bcgov/nr-waste-plus

    steps:
      - uses: actions/checkout@v4

      - name: Clone Test Fixture (${{ matrix.repository }})
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          path: fixture

      - id: action
        uses: ./test-and-analyse
        with:
          commands: |
            echo "Exercising test command: ${{ matrix.test_command }}"
          dir: fixture/${{ matrix.dir }}
          repository: ${{ matrix.repository }}
          triggers: ${{ matrix.triggers }}
          dep_scan: ${{ matrix.dep_scan }}

      - name: Verify trigger behavior
        run: |
          echo "🔍 Verifying trigger behavior for ${{ matrix.name }}"
          if [[ "${{ steps.action.outputs.triggered }}" != "${{ matrix.expected_triggered }}" ]]; then
            echo "❌ ${{ matrix.name }}: expected triggered=${{ matrix.expected_triggered }}, got ${{ steps.action.outputs.triggered }}"
            exit 1
          fi
          echo "✅ ${{ matrix.name }}: expected triggered=${{ matrix.expected_triggered }}, got ${{ steps.action.outputs.triggered }}"
