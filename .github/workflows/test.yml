name: Test Suite

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  filter:
    name: Detect Changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changes: ${{ steps.diff.outputs.changes }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter Changed Paths
        id: diff
        uses: $/diff-triggers
        with:
          filters: |
            builder:
              - 'builder/**'
            scan-url:
              - 'scan-url/**'
            diff-triggers:
              - 'diff-triggers/**'
            image-tracker:
              - 'image-tracker/**'
            pr-description-add:
              - 'pr-description-add/**'
            pr-validate:
              - 'pr-validate/**'
              - '.github/workflows/pr-validate.yml'
            workflow-notifier:
              - 'workflow-notifier/**'
            workflow-results:
              - 'workflow-results/**'
            sysdig-monitor:
              - 'sysdig-monitor/**'
            test-and-analyse:
              - 'test-and-analyse/**'
            # Shared runner infrastructure and test harness changes trigger the full suite
            # rather than triggering blanket integration runs across unrelated actions.
            workflows:
              - '.github/workflows/test.yml'
              - '.tool-versions'
              - 'package.json'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - '.prettierrc.json'
              - '.prettierignore'
            # Lock refresh must ncc-compile JS actions in-job; do not run
            # path-match jobs that assert against this PR's changed files.
            lockfile:
              - 'package-lock.json'

  # ─── BUILDER ───────────────────────────────────────────────────────────────
  test-builder-build:
    name: Test Builder (Build)
    needs: [filter]
    if: contains(fromJSON(needs.filter.outputs.changes), 'builder') || contains(fromJSON(needs.filter.outputs.changes), 'workflows') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Context self-check
        run: bash builder/tests/self-check.sh

      - id: build
        uses: $/builder
        with:
          package: backend
          repository: bcgov/quickstart-openshift

      - if: steps.build.outputs.triggered != 'false'
        run: |
          echo "Outputs: ${{ toJSON(steps.build.outputs) }}"
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "Fork PR: digest optional (image publishes on fork push)."
          elif [ -z "${{ steps.build.outputs.digest }}" ]; then
            echo "Error! digest required when the image is in GHCR."
            exit 1
          fi
          if [ "${{ steps.build.outputs.registry_host }}" != "ghcr.io" ]; then
            echo "Error! registry_host mismatch: ${{ steps.build.outputs.registry_host }}"
            exit 1
          fi
          if [ -z "${{ steps.build.outputs.image_path }}" ]; then
            echo "Error! image_path is empty."
            exit 1
          fi
          echo "Verified registry_host and image_path: ${{ steps.build.outputs.registry_host }} and ${{ steps.build.outputs.image_path }}"

  test-builder-matrix:
    name: Test Builder (No Attestation / Advanced / Single Package / Metadata / Self)
    needs: [filter]
    if: contains(fromJSON(needs.filter.outputs.changes), 'builder') || contains(fromJSON(needs.filter.outputs.changes), 'workflows') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Test No Attestation
        id: no-attestation
        uses: $/builder
        with:
          package: frontend
          build_context: frontend
          repository: bcgov/quickstart-openshift
          tags: ${{ github.event.number || github.run_id }}-no-attestation
          tag_fallback: test
          triggers: |
            frontend/

      - name: Test Advanced (Root Build Context)
        id: advanced
        uses: $/builder
        with:
          package: api
          build_context: .
          build_file: api/Dockerfile
          repository: bcgov/nr-fom
          tags: |
            ${{ github.event.number || github.run_id }}
            ${{ github.event.number || github.run_id }}-multiline
            pr-latest

      - name: Test Single Package Repo Format
        id: single-package
        uses: $/builder
        with:
          package: action-builder
          build_context: .
          build_file: ./Dockerfile
          repository: bcgov/nr-peach
          tags: |
            ${{ github.event.number || github.run_id }}
            single-package-test

      - name: Test Custom Tags
        id: custom-tags
        uses: $/builder
        with:
          package: frontend
          build_context: frontend
          repository: bcgov/quickstart-openshift
          tags: |
            ${{ github.event.number || github.run_id }}
            custom-tag
          tag_fallback: test
          triggers: |
            frontend/

      - name: Test Self Repo
        id: self-repo
        uses: $/builder
        with:
          package: builder-selftest
          build_context: builder/tests
          build_file: builder/tests/Dockerfile
          tags: ${{ github.event.number || github.run_id }}-selftest
          sbom: 'false'
          triggers: |
            builder/
            .github/workflows/

  # Separate package per architecture: amd64 publishes <package> exactly as before; arm64 builds
  # natively on an ARM runner and publishes <package>-arm64, which image-tracker never opens.
  # Chain: build -> verify -> fallback build -> fallback verify.
  test-builder-multiarch:
    name: Test Builder Multi-arch (Build ${{ matrix.runner }})
    needs: [filter]
    if: contains(fromJSON(needs.filter.outputs.changes), 'builder') || contains(fromJSON(needs.filter.outputs.changes), 'workflows') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # Unset on amd64: the deploy package, exactly as today
          - runner: ubuntu-24.04
            architecture: ''
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - uses: $/builder
        with:
          package: builder-multiarch-selftest
          build_context: builder/tests
          build_file: builder/tests/Dockerfile
          architecture: ${{ matrix.architecture }}
          tags: ${{ github.event.number || github.run_id }}-native
          sbom: 'false'

      # An ARM runner without architecture must fail rather than push to the deploy package
      - name: ARM runner without architecture
        id: unset
        if: matrix.architecture == 'arm64'
        continue-on-error: true
        uses: $/builder
        with:
          package: builder-multiarch-selftest
          build_context: builder/tests
          build_file: builder/tests/Dockerfile
          tags: ${{ github.event.number || github.run_id }}-must-not-exist
          sbom: 'false'

      - name: Verify the ARM runner without architecture failed
        if: matrix.architecture == 'arm64'
        run: |
          [ "${{ steps.unset.outcome }}" = "failure" ] || { echo "::error::builder on an ARM runner without architecture should fail, got ${{ steps.unset.outcome }}"; exit 1; }

  test-builder-multiarch-verify:
    name: Test Builder Multi-arch (Verify)
    needs: [test-builder-multiarch]
    # Fork PRs build but can't push, so there's no registry image to verify
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      pull-requests: read
    outputs:
      amd64: ${{ steps.check.outputs.amd64 }}
      arm64: ${{ steps.check.outputs.arm64 }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}/builder-multiarch-selftest
      TAG: ${{ github.event.number || github.run_id }}-native
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Deploys resolve the deploy package this way, with image-tracker unchanged
      - id: tracker
        uses: $/image-tracker
        with:
          package: builder-multiarch-selftest

      - name: Verify the deploy package is amd64 and the -arm64 package is arm64
        id: check
        env:
          TRACKER_DIGEST: ${{ steps.tracker.outputs.digest }}
        run: |
          set -euo pipefail
          digest_of() { docker buildx imagetools inspect "$1" | awk '/^Digest:/ {print $2}'; }
          archs_of() { docker buildx imagetools inspect --raw "$1" | jq -c '[.manifests[]? | select(.platform.os != "unknown") | .platform.architecture] | sort'; }
          for ref in "${IMAGE}:${TAG}" "${IMAGE}:${SHA}"; do
            [ "$(archs_of "${ref}")" = '["amd64"]' ] || { echo "::error::deploy package ${ref} should be amd64 only, got $(archs_of "${ref}")"; exit 1; }
          done
          for ref in "${IMAGE}-arm64:${TAG}" "${IMAGE}-arm64:${SHA}"; do
            [ "$(archs_of "${ref}")" = '["arm64"]' ] || { echo "::error::${ref} should be arm64 only, got $(archs_of "${ref}")"; exit 1; }
          done
          # Neither the ARM build nor the failed unset run touched the deploy package
          if docker buildx imagetools inspect "${IMAGE}:${TAG}-arm64" >/dev/null 2>&1 || docker buildx imagetools inspect "${IMAGE}:${{ github.event.number || github.run_id }}-must-not-exist" >/dev/null 2>&1; then
            echo "::error::an ARM image was pushed to the deploy package"; exit 1
          fi
          amd64=$(digest_of "${IMAGE}:${TAG}")
          [ "${TRACKER_DIGEST}" = "${amd64}" ] || { echo "::error::image-tracker resolved ${TRACKER_DIGEST}, not the amd64 ${amd64}"; exit 1; }
          echo "amd64=${amd64}" >> "${GITHUB_OUTPUT}"
          echo "arm64=$(digest_of "${IMAGE}-arm64:${TAG}")" >> "${GITHUB_OUTPUT}"
          echo "Verified ${IMAGE}:${TAG} (amd64, ${amd64}) and ${IMAGE}-arm64:${TAG} (arm64)"

  # No trigger path changes, so each package retags its own fallback
  test-builder-multiarch-fallback:
    name: Test Builder Multi-arch (Fallback ${{ matrix.runner }})
    needs: [test-builder-multiarch-verify]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: ''
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - uses: $/builder
        with:
          package: builder-multiarch-selftest
          build_context: builder/tests
          build_file: builder/tests/Dockerfile
          architecture: ${{ matrix.architecture }}
          tags: ${{ github.event.number || github.run_id }}-native-fallback
          tag_fallback: ${{ github.event.number || github.run_id }}-native
          sbom: 'false'
          triggers: |
            non-existent-path/

  test-builder-multiarch-fallback-verify:
    name: Test Builder Multi-arch (Fallback Verify)
    needs: [test-builder-multiarch-verify, test-builder-multiarch-fallback]
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify each package retagged its own fallback
        env:
          IMAGE: ghcr.io/${{ github.repository }}/builder-multiarch-selftest
          TAG: ${{ github.event.number || github.run_id }}-native-fallback
          AMD64: ${{ needs.test-builder-multiarch-verify.outputs.amd64 }}
          ARM64: ${{ needs.test-builder-multiarch-verify.outputs.arm64 }}
        run: |
          set -euo pipefail
          digest_of() { docker buildx imagetools inspect "$1" | awk '/^Digest:/ {print $2}'; }
          [ "$(digest_of "${IMAGE}:${TAG}")" = "${AMD64}" ] || { echo "::error::${IMAGE}:${TAG} isn't the original amd64 ${AMD64}"; exit 1; }
          [ "$(digest_of "${IMAGE}-arm64:${TAG}")" = "${ARM64}" ] || { echo "::error::${IMAGE}-arm64:${TAG} isn't the original arm64 ${ARM64}"; exit 1; }
          echo "Verified fallback: ${IMAGE}:${TAG} -> ${AMD64}, ${IMAGE}-arm64:${TAG} -> ${ARM64}"

  # ─── SCAN URL ───────────────────────────────────────────────────────────────
  test-scan-url:
    name: Test Scan URL
    needs: [filter]
    if: contains(fromJSON(needs.filter.outputs.changes), 'scan-url') || contains(fromJSON(needs.filter.outputs.changes), 'workflows') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Run Unit Tests
        run: bash scan-url/tests/unit.sh

      - name: Validate action.yml
        run: |
          test -f scan-url/action.yml
          pip install pyyaml -q
          python3 -c "import yaml; yaml.safe_load(open('scan-url/action.yml'))"

      - name: Empty url fails fast
        id: empty_url
        continue-on-error: true
        uses: $/scan-url
        with:
          url: ''

      - name: Invalid url fails fast
        id: invalid_url
        continue-on-error: true
        uses: $/scan-url
        with:
          url: 'not-a-url'

      - name: Unreachable url fails fast
        id: unreachable_url
        continue-on-error: true
        uses: $/scan-url
        with:
          url: https://scan-url-test.invalid

      - name: Both scanners off fails fast
        id: no_scanners
        continue-on-error: true
        uses: $/scan-url
        with:
          url: https://example.com
          zap: 'false'
          nuclei: 'false'

      - name: Invalid toggle fails fast
        id: invalid_toggle
        continue-on-error: true
        uses: $/scan-url
        with:
          url: https://example.com
          zap: 'yes'

      - name: Verify input guards failed
        run: |
          if [ "${{ steps.empty_url.outcome }}" != "failure" ] || \
             [ "${{ steps.invalid_url.outcome }}" != "failure" ] || \
             [ "${{ steps.unreachable_url.outcome }}" != "failure" ] || \
             [ "${{ steps.no_scanners.outcome }}" != "failure" ] || \
             [ "${{ steps.invalid_toggle.outcome }}" != "failure" ]; then
            echo "::error::scan-url must fail on an empty, invalid or unreachable url, an invalid toggle, or both scanners off"
            exit 1
          fi
          echo "Input guards failed fast as expected."

  # Real scans of quickstart-openshift TEST frontend and backend. A down site
  # fails that matrix leg on purpose. ZAP issue writing stays on so each URL's
  # issue is maintained in this repo. Slugs keep artifacts and SARIF apart.
  test-scan-url-live:
    name: Test Scan URL (Live) (${{ matrix.name }})
    needs: [filter]
    if: contains(fromJSON(needs.filter.outputs.changes), 'scan-url') || contains(fromJSON(needs.filter.outputs.changes), 'workflows') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      issues: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            url: https://quickstart-openshift-test.apps.silver.devops.gov.bc.ca/
            slug: quickstart-openshift-test-apps-silver-devops-gov-bc-ca
          - name: backend
            url: https://quickstart-openshift-test.apps.silver.devops.gov.bc.ca/api
            slug: quickstart-openshift-test-apps-silver-devops-gov-bc-ca-api
    steps:
      - uses: actions/checkout@v7

      - name: Scan quickstart-openshift test
        id: scan
        uses: $/scan-url
        with:
          url: ${{ matrix.url }}

      - name: Verify reports, SARIF and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          for f in report_json.json zap-results.sarif nuclei-results.jsonl nuclei-results.sarif; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          echo "ZAP results: $(jq '.runs[0].results | length' zap-results.sarif)"
          echo "Nuclei findings: $(wc -l < nuclei-results.jsonl)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[].name' | grep -qx "zap_scan-${SLUG}" \
            || { echo "::error::artifact zap_scan-${SLUG} not uploaded"; exit 1; }
          categories="$(gh api "repos/${GITHUB_REPOSITORY}/code-scanning/analyses?ref=${GITHUB_REF}&per_page=100" --jq '.[] | select(.commit_sha == env.GITHUB_SHA) | .category')"
          echo "Code scanning categories on ${GITHUB_SHA}:"
          echo "$categories"
          for c in "zap-${SLUG}" "nuclei-${SLUG}"; do
            grep -Eq "^${c}/?$" <<<"$categories" || { echo "::error::no SARIF analysis with category ${c}"; exit 1; }
          done

  # Both matrix legs upload before this runs, so a shared artifact name or SARIF
  # category would show up as a missing slug here.
  test-scan-url-matrix:
    name: Test Scan URL (Two URLs)
    needs: [filter, test-scan-url-live]
    if: contains(fromJSON(needs.filter.outputs.changes), 'scan-url') || contains(fromJSON(needs.filter.outputs.changes), 'workflows') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      security-events: read
    steps:
      - name: Verify both URLs kept separate artifacts and analyses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[].name')"
          echo "Artifacts:"
          echo "$artifacts"
          categories="$(gh api "repos/${GITHUB_REPOSITORY}/code-scanning/analyses?ref=${GITHUB_REF}&per_page=100" --jq '.[] | select(.commit_sha == env.GITHUB_SHA) | .category')"
          echo "Code scanning categories on ${GITHUB_SHA}:"
          echo "$categories"
          for slug in \
            quickstart-openshift-test-apps-silver-devops-gov-bc-ca \
            quickstart-openshift-test-apps-silver-devops-gov-bc-ca-api
          do
            grep -qx "zap_scan-${slug}" <<<"$artifacts" \
              || { echo "::error::artifact zap_scan-${slug} not uploaded"; exit 1; }
            for c in "zap-${slug}" "nuclei-${slug}"; do
              grep -Eq "^${c}/?$" <<<"$categories" || { echo "::error::no SARIF analysis with category ${c}"; exit 1; }
            done
          done

  # ─── DIFF TRIGGERS ──────────────────────────────────────────────────────────
  test-diff-triggers:
    name: Test Diff Triggers
    needs: [filter]
    if: contains(fromJSON(needs.filter.outputs.changes), 'diff-triggers') || contains(fromJSON(needs.filter.outputs.changes), 'workflows') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Parser Self-Check
        run: node diff-triggers/self-check.js

      # Local commit with a known change, so results do not depend on what the PR touched
      - name: Commit Fixture Change
        run: |
          mkdir -p .diff-triggers-fixture
          echo fixture > .diff-triggers-fixture/changed.txt
          git add .diff-triggers-fixture/changed.txt
          git -c user.name=diff-triggers-test -c user.email=diff-triggers-test@example.invalid commit -q -m "test: diff-triggers fixture"

      - name: Test Match
        id: match
        uses: $/diff-triggers
        with:
          triggers: |
            path/to/nowhere
            .diff-triggers-fixture/
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test No Match
        id: no_match
        uses: $/diff-triggers
        with:
          triggers: |
            diff-triggers/
            path/to/nowhere
          ref: HEAD~1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Omitted Triggers
        id: omitted
        uses: $/diff-triggers
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Custom Ref
        id: custom_ref
        uses: $/diff-triggers
        with:
          triggers: |
            .diff-triggers-fixture/
          ref: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Formats (Bash / Comma / Semi / JSON)
        id: formats
        uses: $/diff-triggers
        with:
          triggers: '["path/to/nowhere", ".diff-triggers-fixture/"]'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Dynamic Filters
        id: dynamic_filters
        uses: $/diff-triggers
        with:
          filters: |
            diff-triggers:
              - '.diff-triggers-fixture/**'
            non-existent:
              - 'non-existent-path/**'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert Outputs
        run: |
          echo "Match: ${{ steps.match.outputs.triggered }} (expected: true)"
          echo "No-Match: ${{ steps.no_match.outputs.triggered }} (expected: false)"
          echo "Omitted: ${{ steps.omitted.outputs.triggered }} (expected: true)"
          echo "Custom Ref: ${{ steps.custom_ref.outputs.triggered }} (expected: true)"
          echo "Formats: ${{ steps.formats.outputs.triggered }} (expected: true)"
          echo "Dynamic matched: ${{ steps.dynamic_filters.outputs['diff-triggers'] }} (expected: true)"
          echo "Dynamic unmatched: ${{ steps.dynamic_filters.outputs['non-existent'] }} (expected: false)"
          echo "Dynamic changes: ${{ steps.dynamic_filters.outputs.changes }}"

          if [[ "${{ steps.match.outputs.triggered }}" != "true" ]] || \
             [[ "${{ steps.no_match.outputs.triggered }}" != "false" ]] || \
             [[ "${{ steps.omitted.outputs.triggered }}" != "true" ]] || \
             [[ "${{ steps.custom_ref.outputs.triggered }}" != "true" ]] || \
             [[ "${{ steps.formats.outputs.triggered }}" != "true" ]] || \
             [[ "${{ steps.dynamic_filters.outputs['diff-triggers'] }}" != "true" ]] || \
             [[ "${{ steps.dynamic_filters.outputs['non-existent'] }}" != "false" ]] || \
             [[ '${{ steps.dynamic_filters.outputs.changes }}' != '["diff-triggers"]' ]]; then
            echo "Error: Diff-triggers output assertion failed."
            exit 1
          fi
          echo "All diff-triggers assertions passed."

      - name: Test Existing Checkout Preservation
        run: echo sentinel >> README.md

      - uses: $/diff-triggers
        with:
          triggers: |
            diff-triggers/
            .github/
            .tool-versions
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert Existing Checkout Survived
        run: |
          if ! grep -q sentinel README.md; then
            echo "Error! diff-triggers re-cloned over caller checkout."
            exit 1
          fi
          echo "Verified: caller's checkout left intact."

  # ─── IMAGE TRACKER ──────────────────────────────────────────────────────────
  test-image-tracker:
    name: Test Image Tracker (${{ matrix.repo }} / ${{ matrix.package }})
    needs: [filter]
    if: contains(fromJSON(needs.filter.outputs.changes), 'image-tracker') || contains(fromJSON(needs.filter.outputs.changes), 'workflows') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: bcgov/quickstart-openshift
            package: frontend
          - repo: bcgov/quickstart-openshift
            package: backend
          - repo: miniontech/vexilon
            package: agnav
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run Unit Tests
        run: node --test image-tracker/tests/unit.test.js

      - name: Validate action.yml
        run: |
          test -f image-tracker/action.yml
          pip install pyyaml -q
          python3 -c "import yaml; yaml.safe_load(open('image-tracker/action.yml'))"

      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          path: target
          fetch-depth: 0

      - id: discover
        name: Discover labeled image for package
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ matrix.repo }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          lc_repo=$(echo "${TARGET_REPO}" | tr '[:upper:]' '[:lower:]')
          image_path="${lc_repo}/${PACKAGE}"
          accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
          accept_m='application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'

          probe_tag() {
            local tag="$1" b="$2"
            local resp body mtype child cfg rev mdigest
            resp=$(curl -sS -L -i -H "Authorization: Bearer ${b}" -H "Accept: ${accept}" \
              "https://ghcr.io/v2/${image_path}/manifests/${tag}")
            mdigest=$(printf '%s' "$resp" \
              | awk 'BEGIN{IGNORECASE=1}/^docker-content-digest:/{gsub(/\r/,""); print $2; exit}')
            body=$(printf '%s' "$resp" | awk 'BEGIN{p=0}/^\r?$/{p=1;next}p{print}')
            mtype=$(printf '%s' "$body" | jq -r '.mediaType // empty')
            if [[ "$mtype" == *index* || "$mtype" == *manifest.list* ]]; then
              child=$(printf '%s' "$body" | jq -r '
                (.manifests[] | select(.platform.architecture=="amd64" and (.platform.os//"")!="unknown") | .digest),
                (.manifests[0].digest)' 2>/dev/null | head -1)
              body=$(curl -sS -H "Authorization: Bearer ${b}" -H "Accept: ${accept_m}" \
                "https://ghcr.io/v2/${image_path}/manifests/${child}" 2>/dev/null || true)
            fi
            cfg=$(printf '%s' "$body" | jq -r '.config.digest // empty')
            [[ -z "$cfg" ]] && return 0
            rev=$(curl -sSL -H "Authorization: Bearer ${b}" \
              "https://ghcr.io/v2/${image_path}/blobs/${cfg}" \
              | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' 2>/dev/null || true)
            [[ -z "$rev" || "$rev" == "null" ]] && return 0
            printf '%s\t%s' "$rev" "$mdigest"
          }

          bearer=$(curl -sS -u "x:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${image_path}:pull" | jq -r '.token')

          found_rev=""
          found_digest=""
          found_tag=""

          try_probe() {
            local tag="$1" result
            result=$(probe_tag "$tag" "$bearer" || true)
            if [[ -n "$result" ]]; then
              found_rev="${result%%$'\t'*}"
              found_digest="${result##*$'\t'}"
              found_tag="$tag"
              return 0
            fi
            return 1
          }

          for cand in $(cd target && git rev-list --topo-order -n 20 HEAD); do
            short_sha="${cand:0:7}"
            cand_pr=$(GH_TOKEN="$GH_TOKEN" gh api "/repos/${TARGET_REPO}/commits/${cand}/pulls" --jq 'if length > 0 then .[0].number else empty end' 2>/dev/null || true)

            try_probe "sha-${short_sha}" && break
            try_probe "${cand}" && break
            try_probe "sha-${cand}" && break
            # pr-<n> is docker/metadata; bare <n> is what some builders publish. Probe both. outputs.pr is the number.
            if [[ -n "$cand_pr" ]]; then
              try_probe "pr-${cand_pr}" && break
              try_probe "${cand_pr}" && break
            fi
          done

          if [[ -z "$found_rev" ]]; then
            echo "::error::No labeled image found for ${PACKAGE} in ${TARGET_REPO}"
            exit 1
          fi

          (
            cd target
            git fetch --quiet origin "${found_rev}" 2>/dev/null || true
          )

          pr_num=$(GH_TOKEN="$GH_TOKEN" gh api "/repos/${TARGET_REPO}/commits/${found_rev}/pulls" --jq 'if length > 0 then .[0].number else empty end' 2>/dev/null || true)

          echo "Ground truth: pkg=${PACKAGE} tag=${found_tag} commit=${found_rev} digest=${found_digest} pr=${pr_num}"
          {
            echo "revision=${found_rev}"
            echo "digest=${found_digest}"
            echo "pr=${pr_num}"
          } >> "$GITHUB_OUTPUT"

      - id: track
        name: Resolve via image-tracker action
        uses: $/image-tracker
        with:
          package: ${{ matrix.package }}
          revision: ${{ steps.discover.outputs.revision }}
          repository: ${{ matrix.repo }}
          dir: target
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify action outputs
        env:
          TARGET_REPO: ${{ matrix.repo }}
          PACKAGE: ${{ matrix.package }}
          EXPECTED_DIGEST: ${{ steps.discover.outputs.digest }}
          EXPECTED_PR: ${{ steps.discover.outputs.pr }}
          GOT_DIGEST: ${{ steps.track.outputs.digest }}
          GOT_IMAGE: ${{ steps.track.outputs.image }}
          GOT_IMAGES: ${{ steps.track.outputs.images }}
          GOT_PR: ${{ steps.track.outputs.pr }}
        run: |
          set -euo pipefail
          lc_repo=$(echo "$TARGET_REPO" | tr '[:upper:]' '[:lower:]')
          image_path="${lc_repo}/${PACKAGE}"

          echo "Got digest:  ${GOT_DIGEST}"
          echo "Got image:   ${GOT_IMAGE}"
          echo "Got images:  ${GOT_IMAGES}"
          echo "Got pr:      ${GOT_PR}"
          echo "Expected:    ${EXPECTED_DIGEST}"

          if [[ "$GOT_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo "::error::${PACKAGE}: digest mismatch: got ${GOT_DIGEST} expected ${EXPECTED_DIGEST}"
            exit 1
          fi
          if [[ "$GOT_IMAGE" != "ghcr.io/${image_path}@${EXPECTED_DIGEST}" ]]; then
            echo "::error::${PACKAGE}: image ref wrong: got ${GOT_IMAGE}"
            exit 1
          fi
          if ! echo "$GOT_IMAGES" | jq -e --arg k "$PACKAGE" '.[$k]' >/dev/null 2>&1; then
            echo "::error::${PACKAGE}: images JSON missing key ${PACKAGE}"
            exit 1
          fi
          if [[ -n "$EXPECTED_PR" && "$GOT_PR" != "$EXPECTED_PR" ]]; then
            echo "::error::${PACKAGE}: pr mismatch: got '${GOT_PR}' expected '${EXPECTED_PR}'"
            exit 1
          fi
          echo "✅ ${PACKAGE}: resolved correctly"

      # Walk ancestry for the newest labeled digest. A miss, fork, or gap
      # is exit 1 — no skip, no retag, no PR-tag hunting.
      - id: walk
        name: Walk history for latest digest
        uses: $/image-tracker
        with:
          package: ${{ matrix.package }}
          revision: HEAD
          repository: ${{ matrix.repo }}
          dir: target
          max_depth: '100'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify walk resolved
        env:
          PACKAGE: ${{ matrix.package }}
          GOT_DIGEST: ${{ steps.walk.outputs.digest }}
          GOT_IMAGE: ${{ steps.walk.outputs.image }}
        run: |
          set -euo pipefail
          if [[ -z "$GOT_DIGEST" ]]; then
            echo "::error::${PACKAGE}: history walk produced no digest" >&2
            exit 1
          fi
          echo "✅ ${PACKAGE}: ${GOT_IMAGE}"

  # ─── PR DESCRIPTION ADD ────────────────────────────────────────────────────
  test-pr-description-add:
    name: Test PR Description Add
    needs: [filter]
    if: contains(fromJSON(needs.filter.outputs.changes), 'pr-description-add') || contains(fromJSON(needs.filter.outputs.changes), 'workflows') || contains(fromJSON(needs.filter.outputs.changes), 'lockfile') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Comparison self-check
        run: node --experimental-strip-types --no-warnings tests/self-check.ts
        working-directory: pr-description-add

      - uses: $/pr-description-add
        if: github.event_name == 'pull_request'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add_markdown: 'Automated Integration Test Verification'

  # ─── PR VALIDATE ───────────────────────────────────────────────────────────
  test-pr-validate:
    name: Test PR Validate
    needs: [filter]
    if: contains(fromJSON(needs.filter.outputs.changes), 'pr-validate') || contains(fromJSON(needs.filter.outputs.changes), 'workflows') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Context self-check
        run: bash pr-validate/tests/self-check.sh

      - name: Test pr-validate action
        if: github.event_name == 'pull_request'
        uses: $/pr-validate
        with:
          conventional_commits: 'false'
          add_markdown: 'pr-validate wrapper integration test'

  test-pr-validate-lint:
    name: Test PR Validate workflow lint
    needs: [filter]
    if: contains(fromJSON(needs.filter.outputs.changes), 'pr-validate') || contains(fromJSON(needs.filter.outputs.changes), 'workflows') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      # No checkout. The action must see the broken workflow already in the workspace
      # and must not replace it with a clean clone of this repo.
      - name: Seed invalid workflow
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/broken.yml <<'EOF'
          name: broken
          on: push
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - run: echo ${{ '${{ github.evnet }}' }}
          EOF

      - name: Lint should fail
        id: lint
        continue-on-error: true
        uses: $/pr-validate
        with:
          conventional_commits: 'false'

      - name: Assert workflow lint failed
        run: |
          if [ "${{ steps.lint.outcome }}" != "failure" ]; then
            echo "::error::pr-validate accepted a workflow with an invalid expression"
            exit 1
          fi
          if ! grep -q 'evnet' "$RUNNER_TEMP/pr-validate-actionlint-out"; then
            echo "::error::actionlint did not report the invalid expression"
            exit 1
          fi
          if ! grep -q 'github.evnet' .github/workflows/broken.yml; then
            echo "::error::pr-validate replaced the seeded workflow before linting it"
            exit 1
          fi

  # ─── WORKFLOW RESULTS ───────────────────────────────────────────────────────
  test-workflow-results:
    name: Test Workflow Results
    needs: [filter]
    if: contains(fromJSON(needs.filter.outputs.changes), 'workflow-results') || contains(fromJSON(needs.filter.outputs.changes), 'workflows') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Validate action.yml
        run: |
          test -f workflow-results/action.yml
          pip install pyyaml -q
          python3 -c "
          import yaml
          with open('workflow-results/action.yml') as f:
              action = yaml.safe_load(f)
          assert isinstance(action, dict), 'action.yml must be a mapping'
          for key in ['name', 'description', 'inputs', 'outputs', 'runs']:
              assert key in action and action[key], f'Missing required action field: {key}'
          assert action['runs'].get('using') == 'node24', 'runs.using must be node24'
          assert action['runs'].get('main') == 'index.js', 'runs.main must be index.js'
          assert 'needs' in action['inputs'], 'inputs must declare needs'
          assert action['inputs']['needs'].get('required') is True, 'needs must be required'
          assert 'passed' in action['outputs'], 'missing passed output'
          "

      - name: Run Unit Tests
        run: node --test workflow-results/tests/unit.test.js

      - name: Test Workflow Results Self Action (All Succeeded & Skipped)
        id: self_check_pass
        uses: $/workflow-results
        with:
          needs: '{"job1":{"result":"success"},"job2":{"result":"skipped"}}'
          title: 'Workflow Results Self-Check'
          debug: 'true'

      - name: Verify Pass Outputs
        run: |
          echo "passed: ${{ steps.self_check_pass.outputs.passed }}"
          echo "total: ${{ steps.self_check_pass.outputs.total }}"
          echo "failed: ${{ steps.self_check_pass.outputs.failed }}"
          echo "cancelled: ${{ steps.self_check_pass.outputs.cancelled }}"
          echo "skipped: ${{ steps.self_check_pass.outputs.skipped }}"
          if [ "${{ steps.self_check_pass.outputs.passed }}" != "true" ] || \
             [ "${{ steps.self_check_pass.outputs.total }}" != "2" ] || \
             [ '${{ steps.self_check_pass.outputs.failed }}' != '[]' ] || \
             [ '${{ steps.self_check_pass.outputs.cancelled }}' != '[]' ] || \
             [ '${{ steps.self_check_pass.outputs.skipped }}' != '["job2"]' ]; then
            echo "::error::Output assertions failed for passing gate"
            exit 1
          fi

      - name: Test Workflow Results Self Action (Simulate Failure)
        id: self_check_fail
        continue-on-error: true
        uses: $/workflow-results
        with:
          needs: '{"test":{"result":"failure"},"build":{"result":"success"}}'
          title: 'Failure Simulation Gate'

      - name: Verify Failure Gate Behaved Correctly
        run: |
          if [ "${{ steps.self_check_fail.outcome }}" != "failure" ]; then
            echo "::error::Failure simulation should have failed the step"
            exit 1
          fi
          if [ "${{ steps.self_check_fail.outputs.passed }}" != "false" ]; then
            echo "::error::passed output should be false on failure"
            exit 1
          fi
          if [ '${{ steps.self_check_fail.outputs.failed }}' != '["test"]' ]; then
            echo "::error::failed output does not contain expected failed job"
            exit 1
          fi

      - name: Test Workflow Results Self Action (Simulate Cancelled)
        id: self_check_cancel
        continue-on-error: true
        uses: $/workflow-results
        with:
          needs: '{"deploy":{"result":"cancelled"},"build":{"result":"success"}}'
          title: 'Cancelled Simulation Gate'

      - name: Verify Cancelled Gate Behaved Correctly
        run: |
          if [ "${{ steps.self_check_cancel.outcome }}" != "failure" ]; then
            echo "::error::Cancelled simulation should have failed the step"
            exit 1
          fi
          if [ "${{ steps.self_check_cancel.outputs.passed }}" != "false" ]; then
            echo "::error::passed output should be false on cancellation"
            exit 1
          fi
          if [ '${{ steps.self_check_cancel.outputs.cancelled }}' != '["deploy"]' ]; then
            echo "::error::cancelled output does not contain expected cancelled job"
            exit 1
          fi

      - name: Test Workflow Results Self Action (Simulate Empty Needs Guard)
        id: self_check_empty
        continue-on-error: true
        uses: $/workflow-results
        with:
          needs: '{}'
          title: 'Empty Needs Simulation'

      - name: Verify Empty Needs Failed Fast
        run: |
          if [ "${{ steps.self_check_empty.outcome }}" != "failure" ]; then
            echo "::error::Empty needs should have failed fast"
            exit 1
          fi

  # ─── WORKFLOW NOTIFIER ──────────────────────────────────────────────────────
  test-notifier:
    name: Test Workflow Notifier
    needs: [filter]
    if: contains(fromJSON(needs.filter.outputs.changes), 'workflow-notifier') || contains(fromJSON(needs.filter.outputs.changes), 'workflows') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/CODEOWNERS
            workflow-notifier
          sparse-checkout-cone-mode: false

      - name: Run Unit Tests
        run: bash workflow-notifier/tests/unit.sh

      - name: Validate action.yml
        run: |
          test -f workflow-notifier/action.yml
          pip install pyyaml -q
          python3 -c "
          import yaml
          with open('workflow-notifier/action.yml') as f:
              action = yaml.safe_load(f)
          assert isinstance(action, dict), 'action.yml must be a mapping'
          for key in ['name', 'description', 'inputs', 'outputs', 'runs']:
              assert key in action and action[key], f'Missing required action field: {key}'
          assert action['runs'].get('using') == 'composite', 'runs.using must be composite'
          assert isinstance(action['runs'].get('steps'), list) and len(action['runs']['steps']) > 0, 'runs.steps must be a list'
          assert 'notify_author' in action['inputs'], 'inputs must declare notify_author'
          assert action['inputs']['notify_author'].get('default') == 'true', 'notify_author default must be true'
          assert 'notify_codeowners' in action['inputs'], 'inputs must declare notify_codeowners'
          assert action['inputs']['notify_codeowners'].get('default') == 'fallback', 'notify_codeowners default must be fallback'
          assert 'issue_number' in action['outputs'] and 'assignees' in action['outputs'], 'missing required outputs'
          "

      - name: Dry Run - Simulate Failure Notification
        id: dry_run
        uses: $/workflow-notifier
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: '[DRY RUN] Simulating a failure for testing'
          body: 'This is a dry run test of the notifier action.'
          dry_run: true

      - name: Dry Run - Simulate Failure with Author Disabled
        id: dry_run_disabled
        uses: $/workflow-notifier
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: '[DRY RUN] Simulating a failure without author'
          body: 'This is a dry run test without author.'
          notify_author: false
          dry_run: true

      - name: Dry Run - Simulate Failure with CODEOWNERS Disabled
        id: dry_run_no_codeowners
        uses: $/workflow-notifier
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: '[DRY RUN] Simulating a failure without codeowners'
          body: 'This is a dry run test without codeowners.'
          notify_codeowners: false
          dry_run: true

      - name: Dry Run - Simulate Failure with CODEOWNERS Always Included
        id: dry_run_codeowners_always
        uses: $/workflow-notifier
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: '[DRY RUN] Simulating a failure with codeowners always'
          body: 'This is a dry run test with codeowners always.'
          notify_codeowners: 'true'
          dry_run: true

      - name: Verify Outputs
        run: |
          echo "Output (default):         issue_number = ${{ steps.dry_run.outputs.issue_number }}"
          echo "Output (default):         assignees    = ${{ steps.dry_run.outputs.assignees }}"
          echo "Output (no author):       issue_number = ${{ steps.dry_run_disabled.outputs.issue_number }}"
          echo "Output (no author):       assignees    = ${{ steps.dry_run_disabled.outputs.assignees }}"
          echo "Output (no codeowners):   issue_number = ${{ steps.dry_run_no_codeowners.outputs.issue_number }}"
          echo "Output (no codeowners):   assignees    = ${{ steps.dry_run_no_codeowners.outputs.assignees }}"
          echo "Output (codeowners true): issue_number = ${{ steps.dry_run_codeowners_always.outputs.issue_number }}"
          echo "Output (codeowners true): assignees    = ${{ steps.dry_run_codeowners_always.outputs.assignees }}"
          if [ "${{ steps.dry_run.outputs.issue_number }}" != "0" ] || \
             [ "${{ steps.dry_run_disabled.outputs.issue_number }}" != "0" ] || \
             [ "${{ steps.dry_run_no_codeowners.outputs.issue_number }}" != "0" ] || \
             [ "${{ steps.dry_run_codeowners_always.outputs.issue_number }}" != "0" ]; then
            echo "::error::Dry run should have returned issue_number 0"
            exit 1
          fi
          if [ -z "${{ steps.dry_run.outputs.assignees }}" ] || [ -z "${{ steps.dry_run_disabled.outputs.assignees }}" ]; then
            echo "::error::No assignees detected"
            exit 1
          fi
          echo "All notifier tests passed."

  # ─── SYSDIG MONITOR ────────────────────────────────────────────────────────
  test-sysdig-monitor:
    name: Test Sysdig Monitor
    needs: [filter]
    if: contains(fromJSON(needs.filter.outputs.changes), 'sysdig-monitor') || contains(fromJSON(needs.filter.outputs.changes), 'workflows') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Run Unit Tests
        run: bash sysdig-monitor/tests/unit.sh

      - name: Validate action.yml
        run: |
          test -f sysdig-monitor/action.yml
          pip install pyyaml -q
          python3 -c "import yaml; yaml.safe_load(open('sysdig-monitor/action.yml'))"

      - name: Validate channel template
        run: |
          python3 -c "import json; json.load(open('sysdig-monitor/templates/channel.json'))"

      - name: Action no-ops when token is empty
        uses: $/sysdig-monitor
        with:
          sysdig_api_token: ''
          oc_namespace: abc123-prod
          app: dry-run-app

  # ─── TEST AND ANALYSE ───────────────────────────────────────────────────────
  test-test-and-analyse:
    name: Test Test and Analyse (${{ matrix.name }})
    needs: [filter]
    if: contains(fromJSON(needs.filter.outputs.changes), 'test-and-analyse') || contains(fromJSON(needs.filter.outputs.changes), 'workflows') || contains(fromJSON(needs.filter.outputs.changes), 'lockfile') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        name:
          [
            backend-triggered,
            backend-not-triggered,
            frontend-basic,
            frontend-no-triggers,
            waste-frontend,
            java-basic,
            fom-autodiscover
          ]
        include:
          - name: backend-triggered
            dir: backend
            triggers: ''
            expected_triggered: true
            repository: bcgov/quickstart-openshift
            test_command: npm install --no-package-lock && npm run test:cov
            exercise_sonar: true
          - name: backend-not-triggered
            dir: backend
            triggers: "('not-existent-path/')"
            expected_triggered: false
            repository: bcgov/quickstart-openshift
            test_command: npm install --no-package-lock && npm run test:cov
          - name: frontend-basic
            dir: frontend
            triggers: ''
            expected_triggered: true
            repository: bcgov/quickstart-openshift
            test_command: npm install --no-package-lock && npm run test:cov
          - name: frontend-no-triggers
            dir: frontend
            expected_triggered: true
            dep_scan: off
            test_command: npm install --no-package-lock && npm run test:cov
            repository: bcgov/quickstart-openshift
          - name: waste-frontend
            dir: frontend
            expected_triggered: true
            dep_scan: warn
            test_command: echo "Good enough for testing knip!"
            repository: bcgov/nr-waste-plus
          - name: java-basic
            dir: backend
            language: java
            java_version: '17'
            triggers: ''
            expected_triggered: true
            repository: bcgov/nr-forest-client
            test_command: timeout 10m mvn -B verify -P all-tests -DskipTests
            cache: 'none'
          - name: fom-autodiscover
            dir: ''
            triggers: ''
            expected_triggered: true
            repository: bcgov/nr-fom
            test_command: echo "Testing autodiscover on nr-fom"
            expected_config: '.github/knip.json'
    steps:
      - id: action
        uses: $/test-and-analyse
        with:
          checkout_path: test-project
          commands: |
            ${{ matrix.test_command }}
          dir: test-project/${{ matrix.dir }}
          node_version: '24'
          language: ${{ matrix.language || 'node' }}
          java_version: ${{ matrix.java_version || '21' }}
          repository: ${{ matrix.repository }}
          triggers: ${{ matrix.triggers }}
          sonar_token: ${{ matrix.exercise_sonar == true && secrets.SONAR_TOKEN || '' }}
          require_sonar: 'false'
          cache: ${{ matrix.cache }}

      - name: Verify trigger behavior
        run: |
          expected="${{ matrix.expected_triggered }}"
          if [ "${{ matrix.name }}" = "backend-not-triggered" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            expected="true"
          fi
          actual="${{ steps.action.outputs.triggered }}"
          if [ "$actual" != "$expected" ]; then
            echo "❌ ${{ matrix.name }}: expected triggered=$expected, got $actual"
            exit 1
          fi
          echo "✅ ${{ matrix.name }}: expected triggered=$expected, got $actual"

      - name: Verify discovered knip config
        if: matrix.expected_config != ''
        run: |
          CONFIG_OUT="${{ steps.action.outputs.knip_config }}"
          EXPECTED_SUFFIX="${{ matrix.expected_config }}"
          if [[ "$CONFIG_OUT" != *"$EXPECTED_SUFFIX" ]]; then
            echo "❌ Expected knip_config output to end with '$EXPECTED_SUFFIX', got '$CONFIG_OUT'"
            exit 1
          fi
          echo "✅ Discovered Knip config correctly matched: $CONFIG_OUT"

  test-test-and-analyse-shallow:
    name: Test Test and Analyse (Existing Shallow Checkout)
    needs: [filter]
    if: contains(fromJSON(needs.filter.outputs.changes), 'test-and-analyse') || contains(fromJSON(needs.filter.outputs.changes), 'workflows') || contains(fromJSON(needs.filter.outputs.changes), 'lockfile') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: bash test-and-analyse/tests/unit.sh

      - run: echo sentinel >> README.md

      - uses: $/test-and-analyse
        with:
          commands: echo "Nothing to run; this cell is about the checkout."
          dir: .
          cache: none
          dep_scan: off

      - name: Verify history deepened in place
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "❌ History is still shallow"
            exit 1
          fi
          if ! grep -q sentinel README.md; then
            echo "❌ The action re-cloned over caller checkout"
            exit 1
          fi
          echo "✅ Deepened in place, caller's checkout intact."

  # ─── RESULTS AGGREGATOR ─────────────────────────────────────────────────────
  results:
    name: PR Results
    needs:
      - filter
      - test-builder-build
      - test-builder-matrix
      - test-builder-multiarch
      - test-builder-multiarch-verify
      - test-builder-multiarch-fallback
      - test-builder-multiarch-fallback-verify
      - test-scan-url
      - test-scan-url-live
      - test-scan-url-matrix
      - test-diff-triggers
      - test-image-tracker
      - test-pr-description-add
      - test-pr-validate
      - test-pr-validate-lint
      - test-notifier
      - test-workflow-results
      - test-sysdig-monitor
      - test-test-and-analyse
      - test-test-and-analyse-shallow
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: PR Results Check
        uses: $/workflow-results
        with:
          needs: ${{ toJson(needs) }}
