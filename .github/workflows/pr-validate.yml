name: PR Validate

on:
  pull_request:
    types: [edited, opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-edit-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    name: Validate PR
    if: (! github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: $/pr-validate

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build freshness
        run: |
          npm run build
          git diff --ignore-space-at-eol --exit-code pr-description-add/dist/ test-and-analyse/dist/
          untracked="$(git ls-files --others --exclude-standard -- pr-description-add/dist/ test-and-analyse/dist/)"
          if [ -n "$untracked" ]; then
            printf 'Untracked files in dist/:\n%s\n' "$untracked" >&2
            exit 1
          fi
