name: Release

on:
  push:
    tags: ["v*-src"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Build dist and publish release
    if: github.repository == 'bcgov/actions'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tags
        id: tags
        env:
          SRC_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$SRC_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-src$ ]]; then
            echo "${SRC_TAG} is not vX.Y.Z-src" >&2
            exit 1
          fi
          tag="${SRC_TAG%-src}"
          if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
            echo "${tag} already exists" >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "${SRC_TAG} is not on the main tip" >&2
            exit 1
          fi
          # notes compare -src to -src: newest earlier -src tag whose release tag exists
          previous=""
          for t in $(git tag -l 'v*-src' --sort=-v:refname); do
            v="${t%-src}"
            older=$(printf '%s\n%s\n' "$v" "$tag" | sort -V | head -n 1)
            if [ "$v" != "$tag" ] && [ "$older" = "$v" ] && git rev-parse -q --verify "refs/tags/${v}" > /dev/null; then
              previous="$t"
              break
            fi
          done
          if [ -z "$previous" ]; then
            # first double-tag release: no earlier -src tag exists, so start from the last v* tag
            previous=$(git tag -l 'v*' --sort=-v:refname | grep -v -- '-src$' | head -n 1 || true)
          fi
          if [ -z "$previous" ]; then
            echo "no previous release tag found" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Build dist on a side commit and tag it
        env:
          TAG: ${{ steps.tags.outputs.tag }}
        run: |
          set -euo pipefail
          npm ci
          npm run build
          if [ ! -f test-and-analyse/dist/index.js ]; then
            echo "test-and-analyse/dist/index.js is missing after the build" >&2
            exit 1
          fi
          # dist/ is git-ignored on main; it only lives on this side commit
          git add -f -- test-and-analyse/dist
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "chore(dist): build ncc bundles for ${TAG}"
          git tag "$TAG"
          git push origin "refs/tags/${TAG}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tags.outputs.tag }}
          PREVIOUS: ${{ steps.tags.outputs.previous }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --notes-start-tag "$PREVIOUS"

