name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Build dist and publish release
    if: github.repository == 'bcgov/actions'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tags and cut -src
        id: tags
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "${TAG} is not vX.Y.Z" >&2
            exit 1
          fi
          src="${TAG}-src"
          if git rev-parse -q --verify "refs/tags/${src}" > /dev/null; then
            echo "${src} already exists" >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "${TAG} is not on the main tip" >&2
            exit 1
          fi
          # notes compare -src to -src: newest earlier -src tag
          previous=""
          for t in $(git tag -l 'v*-src' --sort=-v:refname); do
            v="${t%-src}"
            older=$(printf '%s\n%s\n' "$v" "$TAG" | sort -V | head -n 1)
            if [ "$v" != "$TAG" ] && [ "$older" = "$v" ]; then
              previous="$t"
              break
            fi
          done
          if [ -z "$previous" ]; then
            # first double-tag release: no earlier -src tag exists, so start from the last other v* tag
            previous=$(git tag -l 'v*' --sort=-v:refname | grep -v -- '-src$' | grep -vx -- "$TAG" | head -n 1 || true)
          fi
          if [ -z "$previous" ]; then
            echo "no previous release tag found" >&2
            exit 1
          fi
          # permanent marker for the main commit this release was built from
          git tag "$src" HEAD
          git push origin "refs/tags/${src}"
          echo "src=${src}" >> "$GITHUB_OUTPUT"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Build dist on a side commit and move the release tag to it
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          npm ci
          npm run build
          if [ ! -f test-and-analyse/dist/index.js ]; then
            echo "test-and-analyse/dist/index.js is missing after the build" >&2
            exit 1
          fi
          # dist/ is git-ignored on main; it only lives on this side commit
          git add -f -- test-and-analyse/dist
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "chore(dist): build ncc bundles for ${TAG}"
          git tag -f "$TAG"
          git push -f origin "refs/tags/${TAG}"

      - name: Regenerate release notes (-src to -src)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          SRC: ${{ steps.tags.outputs.src }}
          PREVIOUS: ${{ steps.tags.outputs.previous }}
        run: |
          set -euo pipefail
          notes=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$SRC" -f previous_tag_name="$PREVIOUS" --jq .body)
          gh release edit "$TAG" --notes "$notes"
