name: Test Diff Triggers

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint (ShellCheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run ShellCheck
        run: |
          find . -name "*.sh" -print0 | xargs -0 shellcheck -s bash

  unit:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run Unit Tests
        run: |
          bash diff-triggers/tests/unit.sh

  test-parsing:
    name: Test Parsing Logic
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test trigger parsing
        run: |
          echo "Testing trigger parsing logic..."
          
          # Test multiple trigger patterns
          export INPUT_TRIGGERS="('./backend/' './frontend/')"
          bash -c '
            TRIGGERS_STR="${INPUT_TRIGGERS:-}"
            TRIGGERS=()
            while IFS= read -r line; do
              [[ -n "$line" ]] && TRIGGERS+=("$line")
            done < <(grep -o "'"'"'[^'"'"']*'"'"'" <<< "$TRIGGERS_STR" | sed "s/'"'"'"'"'"//g")
            echo "Parsed: ${TRIGGERS[@]}"
            if [ ${#TRIGGERS[@]} -eq 2 ] && [ "${TRIGGERS[0]}" = "./backend/" ] && [ "${TRIGGERS[1]}" = "./frontend/" ]; then
              echo "✅ Multi-trigger parsing works"
            else
              echo "::error::Multi-trigger parsing failed"
              exit 1
            fi
          '
          
          # Test single trigger
          export INPUT_TRIGGERS="('./actions/')"
          bash -c '
            TRIGGERS_STR="${INPUT_TRIGGERS:-}"
            TRIGGERS=()
            while IFS= read -r line; do
              [[ -n "$line" ]] && TRIGGERS+=("$line")
            done < <(grep -o "'"'"'[^'"'"']*'"'"'" <<< "$TRIGGERS_STR" | sed "s/'"'"'"'"'"//g")
            if [ ${#TRIGGERS[@]} -eq 1 ] && [ "${TRIGGERS[0]}" = "./actions/" ]; then
              echo "✅ Single-trigger parsing works"
            else
              echo "::error::Single-trigger parsing failed"
              exit 1
            fi
          '
          
          # Test no triggers (should always trigger)
          unset INPUT_TRIGGERS
          bash -c '
            TRIGGERS_STR="${INPUT_TRIGGERS:-}"
            if [ -z "$TRIGGERS_STR" ]; then
              echo "Empty triggers: will always trigger (expected behavior)"
            else
              echo "::error::Empty trigger test failed"
              exit 1
            fi
          '
          echo "✅ Trigger parsing logic validated"

  test-omitted:
    name: Test Omitted Triggers (always trigger)
    needs: unit
    outputs:
      triggered: ${{ steps.test.outputs.triggered }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: ./diff-triggers
        id: test
        with:
          triggers: ''

  verify-omitted:
    name: Verify Omitted Result
    needs: test-omitted
    runs-on: ubuntu-latest
    steps:
      - name: Verify
        run: |
          if [ "${{ needs.test-omitted.outputs.triggered }}" != "true" ]; then
            echo "::error::test-omitted should always trigger when triggers are omitted/empty"
            exit 1
          fi
          echo "✅ Omitted triggers correctly returns triggered=true"