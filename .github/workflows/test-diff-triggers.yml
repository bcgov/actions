name: Test Diff Triggers

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'diff-triggers/**'
      - '.github/workflows/test-diff-triggers.yml'
  workflow_dispatch:

permissions: {}

jobs:
  test-triggers-match:
    name: "Test Match (Expected: true)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      triggered: ${{ steps.test.outputs.triggered }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./diff-triggers
        id: test
        with:
          triggers: |
            diff-triggers/
            action.yml
            .github/
          github_token: ${{ secrets.GITHUB_TOKEN }}

  test-triggers-no-match:
    name: "Test No Match (Expected: false)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      triggered: ${{ steps.test.outputs.triggered }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./diff-triggers
        id: test
        with:
          triggers: |
            path/to/nowhere
          github_token: ${{ secrets.GITHUB_TOKEN }}

  test-triggers-omitted:
    name: "Test Omitted (Expected: true)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      triggered: ${{ steps.test.outputs.triggered }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./diff-triggers
        id: test
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  test-custom-ref:
    name: "Test Custom Ref (Expected: true)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      triggered: ${{ steps.test.outputs.triggered }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history so refs are available
      - uses: ./diff-triggers
        id: test
        with:
          triggers: |
            diff-triggers/
            action.yml
            .github/
          ref: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  test-legacy-bash-format:
    name: "Test Legacy Bash Format (Expected: true)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      triggered: ${{ steps.test.outputs.triggered }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./diff-triggers
        id: test
        with:
          triggers: ('diff-triggers/' 'action.yml' '.github/')
          github_token: ${{ secrets.GITHUB_TOKEN }}

  test-comma-separated-triggers:
    name: "Test Comma-Separated Triggers (Expected: true)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      triggered: ${{ steps.test.outputs.triggered }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./diff-triggers
        id: test
        with:
          triggers: 'diff-triggers/,action.yml,.github/'
          github_token: ${{ secrets.GITHUB_TOKEN }}

  test-semicolon-separated-triggers:
    name: "Test Semicolon-Separated Triggers (Expected: true)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      triggered: ${{ steps.test.outputs.triggered }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./diff-triggers
        id: test
        with:
          triggers: 'diff-triggers/;action.yml;.github/'
          github_token: ${{ secrets.GITHUB_TOKEN }}

  test-json-array-triggers:
    name: "Test JSON Array Triggers (Expected: true)"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      triggered: ${{ steps.test.outputs.triggered }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./diff-triggers
        id: test
        with:
          triggers: '["diff-triggers/", "action.yml", ".github/"]'
          github_token: ${{ secrets.GITHUB_TOKEN }}

  verify-results:
    name: Verify Results
    needs: [test-triggers-match, test-triggers-no-match, test-triggers-omitted, test-custom-ref, test-legacy-bash-format, test-comma-separated-triggers, test-semicolon-separated-triggers, test-json-array-triggers]
    runs-on: ubuntu-24.04
    steps:
      - name: Assert outputs
        run: |
          echo "Match triggered: ${{ needs.test-triggers-match.outputs.triggered }} (expected: true)"
          echo "No-Match triggered: ${{ needs.test-triggers-no-match.outputs.triggered }} (expected: false)"
          echo "Omitted triggered: ${{ needs.test-triggers-omitted.outputs.triggered }} (expected: true)"
          echo "Custom Ref triggered: ${{ needs.test-custom-ref.outputs.triggered }} (expected: true)"
          
          if [[ "${{ needs.test-triggers-match.outputs.triggered }}" != "true" ]]; then
            echo "Error: test-triggers-match failed"
            exit 1
          fi
          if [[ "${{ needs.test-triggers-no-match.outputs.triggered }}" != "false" ]]; then
            echo "Error: test-triggers-no-match failed"
            exit 1
          fi
          if [[ "${{ needs.test-triggers-omitted.outputs.triggered }}" != "true" ]]; then
            echo "Error: test-triggers-omitted failed"
            exit 1
          fi
          if [[ "${{ needs.test-custom-ref.outputs.triggered }}" != "true" ]]; then
            echo "Error: test-custom-ref failed"
            exit 1
          fi
          
          echo "Legacy bash format triggered: ${{ needs.test-legacy-bash-format.outputs.triggered }} (expected: true)"
          echo "Comma-separated triggered: ${{ needs.test-comma-separated-triggers.outputs.triggered }} (expected: true)"
          echo "Semicolon-separated triggered: ${{ needs.test-semicolon-separated-triggers.outputs.triggered }} (expected: true)"
          echo "JSON Array triggered: ${{ needs.test-json-array-triggers.outputs.triggered }} (expected: true)"
          
          if [[ "${{ needs.test-legacy-bash-format.outputs.triggered }}" != "true" ]]; then
            echo "Error: test-legacy-bash-format failed"
            exit 1
          fi
          if [[ "${{ needs.test-comma-separated-triggers.outputs.triggered }}" != "true" ]]; then
            echo "Error: test-comma-separated-triggers failed"
            exit 1
          fi
          if [[ "${{ needs.test-semicolon-separated-triggers.outputs.triggered }}" != "true" ]]; then
            echo "Error: test-semicolon-separated-triggers failed"
            exit 1
          fi
          if [[ "${{ needs.test-json-array-triggers.outputs.triggered }}" != "true" ]]; then
            echo "Error: test-json-array-triggers failed"
            exit 1
          fi
          echo "All diff-triggers integration test cases passed successfully!"

