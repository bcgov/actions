name: Test Diff Triggers

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint (ShellCheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run ShellCheck
        run: |
          find . -name "*.sh" -print0 | xargs -0 shellcheck -s bash

  unit:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run Unit Tests
        run: |
          bash diff-triggers/tests/unit.sh

  test-parsing:
    name: Test Parsing Logic
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test trigger parsing
        run: |
          cd diff-triggers
          bash -c '
            # Call unit tests which include trigger parsing tests
            bash tests/unit.sh
          '

  test-omitted:
    name: Test Omitted Triggers (always trigger)
    needs: unit
    outputs:
      triggered: ${{ steps.test.outputs.triggered }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: ./diff-triggers
        id: test
        with:
          triggers: ''

  verify-omitted:
    name: Verify Omitted Result
    needs: test-omitted
    runs-on: ubuntu-latest
    steps:
      - name: Verify
        run: |
          if [ "${{ needs.test-omitted.outputs.triggered }}" != "true" ]; then
            echo "::error::test-omitted should always trigger when triggers are omitted/empty"
            exit 1
          fi
          echo "✅ Omitted triggers correctly returns triggered=true"