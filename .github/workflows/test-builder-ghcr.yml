name: Test Builder GHCR

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint (ShellCheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run ShellCheck
        run: |
          find . -name "*.sh" -print0 | xargs -0 shellcheck -s bash

  unit:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run Unit Tests
        run: |
          bash skeleton/tests/unit.sh

  validate:
    name: Validate Action Definition
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Validate action.yml exists
        run: |
          if [ ! -f "builder-ghcr/action.yml" ]; then
            echo "::error::builder-ghcr/action.yml not found"
            exit 1
          fi
          echo "✅ action.yml exists"

      - name: Validate YAML syntax
        run: |
          python3 -c "import yaml; yaml.safe_load(open('builder-ghcr/action.yml'))"
          echo "✅ YAML syntax valid"

  dry-run:
    name: Dry Run Test
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Dry Run
        id: dry_run
        uses: ./builder-ghcr
        with:
          package: builder-ghcr
          tag_fallback: test
          triggers: ('builder-ghcr/')

      - name: Verify Outputs
        run: |
          echo "triggered: ${{ steps.dry_run.outputs.triggered }}"
          echo "digest: ${{ steps.dry_run.outputs.digest }}"
          
          if [ "${{ steps.dry_run.outputs.triggered }}" == "false" ]; then
            echo "✅ Dry run completed - build not triggered (expected for no changes)"
          else
            echo "✅ Dry run completed - build triggered"
          fi