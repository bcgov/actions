name: Test Builder GHCR

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint (ShellCheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run ShellCheck
        run: |
          find . -name "*.sh" -print0 | xargs -0 shellcheck -s bash

  unit:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run Unit Tests
        run: |
          bash skeleton/tests/unit.sh

  validate:
    name: Validate Action Definition
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Validate action.yml exists
        run: |
          if [ ! -f "builder-ghcr/action.yml" ]; then
            echo "::error::builder-ghcr/action.yml not found"
            exit 1
          fi
          echo "✅ action.yml exists"

      - name: Validate YAML syntax
        run: |
          pip install pyyaml -q
          python3 -c "import yaml; yaml.safe_load(open('builder-ghcr/action.yml'))"
          echo "✅ YAML syntax valid"

      - name: Verify triggers input resolves
        run: |
          echo "Testing that triggers parsing works in isolation..."
          export INPUT_TRIGGERS="('builder-ghcr/')"
          bash -c '
            TRIGGERS_STR="${INPUT_TRIGGERS:-}"
            TRIGGERS=()
            while IFS= read -r line; do
              [[ -n "$line" ]] && TRIGGERS+=("$line")
            done < <(grep -o "'"'[^'"']*'"'" <<< "$TRIGGERS_STR" | sed "s/'"'"'"'"'"//g")
            echo "Parsed triggers: ${TRIGGERS[@]}"
            if [ ${#TRIGGERS[@]} -gt 0 ]; then
              echo "✅ Trigger parsing works"
            else
              echo "::error::Failed to parse triggers"
              exit 1
            fi
          '
          echo "✅ Parsing validation complete"