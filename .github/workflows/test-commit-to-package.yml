name: Test Commit to Package

on:
  workflow_dispatch:
  push:
    branches: [fix/squash-merge-resolution]
    paths:
      - 'commit-to-package/**'
      - '.github/workflows/test-commit-to-package.yml'
  pull_request:

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  test-vexilon-resolution:
    name: Test Vexilon Resolution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions Repo
        uses: actions/checkout@v6
        with:
          path: actions-repo

      - name: Checkout Vexilon (Target Repo)
        uses: actions/checkout@v6
        with:
          repository: DerekRoberts/vexilon
          path: vexilon-repo
          fetch-depth: 50

      - name: Direct API Probe (Debug ONLY)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deep probing commit 7b6f8c22 in DerekRoberts/vexilon..."
          # Using -i to see HTTP headers and status
          gh api -i "repos/DerekRoberts/vexilon/commits/7b6f8c222ade55990d24b54dc75d4718fba4722a/pulls" || true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Commit to Package
        id: resolve
        uses: ./actions-repo/commit-to-package
        with:
          images: "vexilon=ghcr.io/derekroberts/vexilon"
          max_depth: 50
          token: ${{ secrets.GITHUB_TOKEN }}
          dir: "vexilon-repo"
          debug: true

      - name: Verify Resolution
        run: |
          BUNDLE='${{ steps.resolve.outputs.bundle }}'
          echo "Resolved Bundle: $BUNDLE"
          
          SHA=$(echo "$BUNDLE" | jq -r '.vexilon')
          
          if [[ "$SHA" == "null" ]] || [[ -z "$SHA" ]]; then
            echo "::error::Failed to resolve vexilon image SHA! Empty bundle detected."
            exit 1
          fi
          
          echo "Successfully resolved vexilon to $SHA"
