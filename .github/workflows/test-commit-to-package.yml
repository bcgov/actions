name: Test Commit to Package

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint (ShellCheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run ShellCheck
        run: |
          find . -name "*.sh" -print0 | xargs -0 shellcheck -s bash

  unit:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run Unit Tests
        run: |
          bash commit-to-package/tests/unit.sh

validate:
    name: Validate Action Definition
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Validate action.yml exists
        run: |
          if [ ! -f "commit-to-package/action.yml" ]; then
            echo "::error::commit-to-package/action.yml not found"
            exit 1
          fi
          echo "✅ action.yml exists"

      - name: Validate YAML syntax
        run: |
          pip install pyyaml -q
          python3 -c "import yaml; yaml.safe_load(open('commit-to-package/action.yml'))"
          echo "✅ YAML syntax valid"

      - name: Verify inputs parse correctly
        run: |
          echo "Testing image mapping parsing..."
          export INPUT_IMAGES="test=ghcr.io/test/test"
          bash -c '
            IMAGES_MAPPING="${INPUT_IMAGES:-}"
            if [[ -z "$IMAGES_MAPPING" ]]; then
              echo "::error::No image mapping provided"
              exit 1
            fi
            declare -A IMAGE_REPOS
            for pair in $IMAGES_MAPPING; do
                component="${pair%%=*}"
                repo="${pair#*=}"
                IMAGE_REPOS["$component"]="$repo"
            done
            echo "Parsed components: ${!IMAGE_REPOS[@]}"
            if [[ "${IMAGE_REPOS[test]}" == "ghcr.io/test/test" ]]; then
              echo "✅ Image mapping parsing works"
            else
              echo "::error::Failed to parse image mapping"
              exit 1
            fi
          '
          echo "✅ Input parsing validation complete"