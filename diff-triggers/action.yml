name: Diff Triggers
description: Check if changed files match trigger paths. Returns true if any trigger matches, false otherwise. Always returns true if triggers are omitted.
branding:
  icon: git-branch
  color: blue

inputs:
  triggers:
    description: >-
      Paths used to trigger an event. Prefer a multiline string (one path per
      line). A comma-separated line, a JSON array and a single path are also
      supported.
      Always triggers if omitted.
    required: false
  debug:
    description: Enable debug logging
    default: "false"
  base:
    description: >-
      Base to diff against (same meaning as dorny/paths-filter `base`) (e.g., 'main', 'HEAD^', commit SHA).
      Defaults to base repo default branch for PRs, or HEAD^ for non-PR events.
      Local refs (HEAD^, HEAD~2) work for non-PR events;
      remote refs (branches, tags, SHAs) work for all events.
    required: false
  token:
    description: 'Authentication token (defaults to github.token; override with PAT if needed).'
    default: ${{ github.token }}
    required: false
  annotations:
    description: Emit workflow summary annotations (::notice::) for fired/not fired results. Set to false to suppress annotations
    required: false
    default: 'true'
  filters:
    description: >-
      A YAML-like multiline string mapping keys to paths.
    required: false

outputs:
  triggered:
    description: Boolean result of triggers
  changes:
    description: JSON array of matching filter names when using filters input

runs:
  using: node24
  main: index.js
