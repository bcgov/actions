name: 'Diff Triggers'
description: 'Check if changed files match trigger paths. Returns true if any trigger matches, false otherwise. Always returns true if triggers are omitted.'
branding:
  icon: package
  color: blue

inputs:
  triggers:
    description: "Paths used to trigger an event; e.g. ('./backend/' './frontend/'); always trigger if omitted"
    required: false
  ref:
    description: "Reference to compare against (e.g., 'main', 'HEAD^', commit SHA). Defaults to base repo default branch for PRs, or HEAD^ for non-PR events."
    required: false
    default: ''
  annotations:
    description: "Emit workflow summary annotations for fired/not fired results"
    required: false
    default: 'true'
  debug:
    description: "Enable debug logging"
    required: false
    default: 'false'

outputs:
  triggered:
    description: "Boolean result of triggers"
    value: ${{ steps.diff.outputs.triggered }}
  base_ref:
    description: "The resolved base ref SHA"
    value: ${{ steps.diff.outputs.base_ref }}
  head_ref:
    description: "The resolved head ref SHA"
    value: ${{ steps.diff.outputs.head_ref }}

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v6
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
        fetch-depth: ${{ github.event.pull_request && 1 || 0 }}

    - id: diff
      shell: bash
      env:
        INPUT_TRIGGERS: ${{ inputs.triggers }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_ANNOTATIONS: ${{ inputs.annotations }}
        INPUT_DEBUG: ${{ inputs.debug }}
      run: bash ${{ github.action_path }}/action.sh
