name: 'Diff Triggers'
description: 'Triggers a build based on file differences using git diff.'

inputs:
  triggers:
    description: 'The files or directories to trigger a build'
    required: true
  ref:
    description: 'The ref to compare against (default: origin/main or HEAD~1)'
    default: ''
  annotations:
    description: 'Whether to enable GitHub annotations'
    default: 'true'

outputs:
  triggered:
    description: 'Whether the build was triggered'
    value: ${{ steps.diff.outputs.triggered }}

runs:
  using: 'composite'
  steps:
    - id: diff
      shell: bash
      env:
        INPUT_TRIGGERS: ${{ inputs.triggers }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_ANNOTATIONS: ${{ inputs.annotations }}
      run: bash ${{ github.action_path }}/action.sh
