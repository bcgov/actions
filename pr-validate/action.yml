name: "PR Validate"
description: "Validate Pull Request metadata like Conventional Commits and fork rules"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  conventional_commits:
    description: "Enforce conventional commits?"
    default: "true"
    required: false
  reject_forks:
    description: "Are forks allowed? [true|false]"
    default: "false"
    required: false
  github_token:
    description: "GitHub token for reading PR metadata"
    required: true

runs:
  using: "composite"
  steps:
    - name: Conventional Commits
      if: inputs.conventional_commits != 'false'
      uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: Fork Check
      if: inputs.reject_forks != 'true' && github.event.pull_request.head.repo.fork
      shell: bash
      run: |
        echo "::error::Forks are not supported for this workflow."
        exit 1
