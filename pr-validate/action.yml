name: "PR Validate"
description: "Validate pull request titles and GitHub Actions workflows"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  conventional_commits:
    description: "Enforce conventional commits?"
    default: "true"
  add_markdown:
    description: "Markdown to append to the PR description. Empty skips pr-description-add."
    required: false
    default: ""
  token:
    description: 'Authentication token (defaults to github.token; override with PAT if needed).'
    default: ${{ github.token }}
    required: false

runs:
  using: "composite"
  steps:
    - name: Fork notice
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
      shell: bash
      run: |
        # shellcheck source=fork-notice.sh
        source "${{ github.action_path }}/fork-notice.sh"
        echo "::warning::$(fork_pr_warning)"

    - name: Conventional Commits
      if: inputs.conventional_commits == 'true' && github.event_name == 'pull_request'
      id: semantic
      uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
      env:
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Conventional Commits Instructions
      if: failure() && steps.semantic.outcome == 'failure'
      shell: bash
      run: |
        echo "::error::Title validation failed. Please edit the PR title at the top of the page to match Conventional Commits (e.g. 'feat: ...', 'fix: ...'). This job will automatically re-run as soon as you save the new title—no manual retry needed! See https://www.conventionalcommits.org/"

    # After the title check. A failed step skips the rest of the composite, and the
    # title failure is the one that tells the author to edit and wait for a re-run.
    - name: Checkout workflows
      if: hashFiles('.github/workflows/*.yml', '.github/workflows/*.yaml') == ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        clean: false

    - name: Lint workflows
      shell: bash
      env:
        ACTIONLINT_CONFIG: ${{ github.action_path }}/actionlint.yaml
      run: bash "${{ github.action_path }}/lint-workflows.sh"

    - name: PR Description
      if: inputs.add_markdown != ''
      uses: $/pr-description-add
      with:
        token: ${{ inputs.token }}
        add_markdown: ${{ inputs.add_markdown }}
