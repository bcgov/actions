name: 'Builder GHCR'
description: 'Builds and pushes images to GHCR using a diff-based trigger.'

inputs:
  package:
    description: 'The name of the package/image being built'
    required: true
  build_context:
    description: 'The path to the build context'
    default: '.'
  build_file:
    description: 'The path to the Containerfile/Dockerfile'
    default: 'Dockerfile'
  tag_fallback:
    description: 'The fallback tag to use if no other tag is found'
    default: 'test'
  tags:
    description: 'Additional tags to apply'
    default: ''
  triggers:
    description: 'The files or directories to trigger a build'
    required: true

outputs:
  image:
    description: 'The final image URL'
    value: ${{ steps.meta.outputs.tags }}
  tag:
    description: 'The primary tag used'
    value: "sha-${{ steps.sha.outputs.short }}"

runs:
  using: 'composite'
  steps:
    - name: Resolve SHA
      id: sha
      shell: bash
      run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Diff Triggers
      id: diff
      uses: bcgov/actions/diff-triggers@main
      with:
        triggers: ${{ inputs.triggers }}

    - name: Docker Metadata
      if: steps.diff.outputs.triggered == 'true'
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}/${{ inputs.package }}
        tags: |
          type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          type=raw,value=sha-${{ steps.sha.outputs.short }}
          ${{ inputs.tags }}

    - name: Set up Docker Buildx
      if: steps.diff.outputs.triggered == 'true'
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      if: steps.diff.outputs.triggered == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build and Push
      if: steps.diff.outputs.triggered == 'true'
      id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.build_context }}
        file: ${{ inputs.build_file }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        provenance: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Summary
      shell: bash
      run: |
        if [ "${{ steps.diff.outputs.triggered }}" == "true" ]; then
          echo "::notice title=Builder GHCR::✅ Build successful for ${{ inputs.package }}"
        else
          echo "::notice title=Builder GHCR::⏭️ Build skipped. (No changes in ${{ inputs.triggers }})"
        fi
