name: 'Builder GHCR'
description: 'Consolidated container builder action for GitHub Container Registry.'

inputs:
  image:
    description: 'Target image name (e.g. ghcr.io/bcgov/vexilon)'
    required: true
  context:
    description: 'Docker build context'
    default: '.'
  file:
    description: 'Path to Containerfile'
    default: './Containerfile'
  triggers:
    description: 'Space-separated list of files/dirs to watch for changes'
    default: '.'
  build_args:
    description: 'Additional build arguments'
    default: ''
  strict_immutability:
    description: "If 'true', skip re-tagging on no-change runs. (Default: 'false' for backward compatibility)"
    default: 'false'

outputs:
  triggered:
    description: "'true' if a new image was built, 'false' if skipped"
    value: ${{ steps.diff.outputs.triggered }}
  image_tag:
    description: 'The primary tag produced (sha-XXXXXXX)'
    value: "sha-${{ steps.sha.outputs.commit }}"

runs:
  using: 'composite'
  steps:
    - name: Resolve commit SHA
      id: sha
      shell: bash
      run: echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Check for changes
      id: diff
      uses: ./.github/actions/diff-triggers
      with:
        triggers: ${{ inputs.triggers }}

    - name: Docker Metadata
      if: steps.diff.outputs.triggered == 'true'
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.image }}
        tags: |
          type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          type=raw,value=sha-${{ steps.sha.outputs.commit }}

    - name: Set up Docker Buildx
      if: steps.diff.outputs.triggered == 'true'
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      if: steps.diff.outputs.triggered == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build and Push
      if: steps.diff.outputs.triggered == 'true'
      id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        provenance: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Retag (Legacy/Compatibility mode)
      if: steps.diff.outputs.triggered == 'false' && inputs.strict_immutability != 'true'
      uses: ./.github/actions/builder-ghcr/retag
      with:
        image: ${{ inputs.image }}
        base_ref: ${{ steps.diff.outputs.base_ref }}

    - name: Summary
      shell: bash
      run: |
        if [ "${{ steps.diff.outputs.triggered }}" == "true" ]; then
          echo "::notice title=Builder GHCR::✅ Build successful for ${{ inputs.image }}"
        elif [ "${{ inputs.strict_immutability }}" == "true" ]; then
          echo "::notice title=Builder GHCR::⏭️ Build skipped. (Forensic Immutable Mode Enabled)"
        else
          echo "::notice title=Builder GHCR::⏭️ Build skipped. Image re-tagged from ${{ steps.diff.outputs.base_ref }} (Compatibility Mode)"
        fi
