name: Java Unit Test and Analysis with SonarCloud
description: Run Java unit tests, can analyse with SonarCloud
branding:
  icon: check-square
  color: blue

inputs:
  ### Required
  commands:
    description: Commands to run tests, start with '|' for multi-line
    required: true

  dir:
    description: App/package directory
    required: true
    pattern: "^[a-zA-Z0-9._/-]+$"

  java-version:
    description: Java version (required)
    required: true
    pattern: '^[0-9]+(\.[0-9]+)*$'

  ### Typical / recommended
  java-cache:
    description: Java package manager cache, defaults to maven
    default: maven
    pattern: "^(maven|gradle)$"

  java-distribution:
    description: Java distribution, defaults to temurin
    default: temurin
    pattern: "^(temurin|corretto|openjdk|zulu)$"

  sonar_args:
    # https://docs.sonarcloud.io/advanced-setup/analysis-parameters/
    description: SonarCloud command line arguments
    default: |
      -Dsonar.organization=bcgov-sonarcloud
      -Dsonar.projectKey=bcgov_${{ github.repository }}

  sonar_token:
    description: Sonar token, provide unpopulated token for pre-setup (will skip)
    default: "__OMITTED__"
    pattern: "^[a-zA-Z0-9]{20,}$"

  sonar_enforce_compliance:
    description: Fail the build if SonarCloud fails. If false, only warn.
    default: "true"
    pattern: "^(true|false)$"

  triggers:
    description: Paths (array) used to trigger a build; e.g. ('./backend/' './frontend/')

  ### Usually a bad idea / not recommended
  diff_branch:
    description: Branch to diff against
    default: ${{ github.event.repository.default_branch }}
    pattern: "^[a-zA-Z0-9._/-]+$"

  repository:
    description: Non-default repository to clone (used for testing this action)
    default: ${{ github.repository }}
    pattern: "^[a-zA-Z0-9-_]+/[a-zA-Z0-9-_]+$"

  branch:
    description: Non-default branch to clone (used for testing this action)
    default: ""
    pattern: "^[a-zA-Z0-9._/-]*$"

outputs:
  triggered:
    description: Whether the action was triggered based on path changes
    value: ${{ steps.diff.outputs.triggered }}

runs:
  using: composite
  steps:
    - name: Warnings for breaking changes
      shell: bash
      run: |
        # Warnings for breaking changes

        # sonar_project_token renamed sonar_token
        if [ -n "${{ inputs.sonar_project_token }}" ] && [ "${{ inputs.sonar_project_token }}" != "__OMITTED__" ]; then
          echo -e "\nsonar_project_token renamed.  Please correct this and try again."
          echo -e "\n\tAction: rename sonar_project_token to sonar_token\n"
          exit 1
        fi

    - id: diff
      shell: bash
      env:
        INPUT_TRIGGERS: ${{ (github.event_name == 'pull_request' && inputs.triggers) || '' }}
        INPUT_REF: ${{ inputs.diff_branch }}
        INPUT_ANNOTATIONS: "true"
        INPUT_GITHUB_TOKEN: ${{ github.token }}
        GITHUB_WORKFLOW: ${{ github.workflow }}
        GITHUB_JOB: ${{ github.job }}
        EVENT_PR_BASE_DEFAULT_BRANCH: ${{ github.event.pull_request.base.repo.default_branch }}
        EVENT_PR_BASE_CLONE_URL: ${{ github.event.pull_request.base.repo.clone_url }}
        EVENT_REPOSITORY_CLONE_URL: ${{ github.event.repository.clone_url }}
      run: bash ${{ github.action_path }}/../diff-triggers/action.sh

    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.branch }}

    # Setup Java and cache dir
    - uses: actions/setup-java@v5
      with:
        cache: ${{ inputs.java-cache }}
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
        server-id: "github"

    # Run tests, hopefully generating coverage for SonarCloud
    - name: Run Tests
      if: steps.diff.outputs.triggered == 'true'
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: |
        # Run tests
        ${{ inputs.commands }}

    ### Optional SonarCloud

    - id: validate-sonar-token
      if: steps.diff.outputs.triggered == 'true'
      shell: bash
      run: |
        # Validate SonarCloud Token
        TOKEN="${{ inputs.sonar_token }}"
        TRIMMED="${TOKEN//[[:space:]]/}"

        if [ "$TRIMMED" = "__OMITTED__" ]; then
          # Intentionally omitted by the user, skip silently without warning
          echo "run_sonar=false" >> "$GITHUB_OUTPUT"
        elif [ -z "$TRIMMED" ]; then
          # Explicitly provided but resolved to empty string (e.g. empty repository secret)
          echo "::warning title=SonarCloud Skipped::⚠️ SonarCloud token (sonar_token) is missing or empty. Skipping SonarCloud analysis. If you want to enable SonarCloud, ensure the SONAR_TOKEN repository secret is set and passed correctly."
          echo "run_sonar=false" >> "$GITHUB_OUTPUT"
        else
          echo "run_sonar=true" >> "$GITHUB_OUTPUT"
        fi

    - if: steps.validate-sonar-token.outputs.run_sonar == 'true' && steps.diff.outputs.triggered == 'true'
      env:
        SONAR_TOKEN: ${{ inputs.sonar_token }}
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: |
        # Run SonarCloud for ${{ inputs.java-cache }}

        # Disable shell failure-on-error so we can catch and handle the exit code
        set +e

        if [ "${{ inputs.java-cache }}" == "maven" ]; then
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.host.url=https://sonarcloud.io ${{ inputs.sonar_args }}
          STATUS=$?
        elif [ "${{ inputs.java-cache }}" == "gradle" ]; then
          ./gradlew build sonarqube --info -Dsonar.host.url=https://sonarcloud.io ${{ inputs.sonar_args }}
          STATUS=$?
        else
          echo "::error::ERROR: inputs.java-cache = ${{ inputs.java-cache }}"
          exit 1
        fi

        # If SonarCloud failed, handle it based on compliance requirements
        if [ $STATUS -ne 0 ]; then
          if [ "${{ inputs.sonar_enforce_compliance }}" == "true" ]; then
            echo "::error title=SonarCloud Failed::❌ SonarCloud analysis failed (sonar_enforce_compliance: true). Check token, project configuration, or SonarCloud status."
            exit 1
          else
            echo "::warning title=SonarCloud Failed::⚠️ SonarCloud analysis failed. This is usually caused by an expired/invalid SONAR_TOKEN, or a missing/stale project on SonarCloud. Since SonarCloud is optional, the build will continue, but you should check your repository secrets and SonarCloud project status."
          fi
        fi

        # Always return 0 to prevent blocking the pipeline for non-blocking fallbacks
        exit 0

    ### Cleanup

    # Fix - Clone for action.yml and other verifications
    - name: Checkout Action repo to pass tests
      if: always() && inputs.repository != github.repository
      uses: actions/checkout@v6
