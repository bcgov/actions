name: "workflow-notifier"
description: "Find CODEOWNERS and notify them via GitHub Issues on failure"
branding:
  icon: "alert-circle"
  color: "red"

inputs:
  token:
    description: 'Authentication token (defaults to github.token; override with PAT if needed).'
    default: ${{ github.token }}
    required: false
  title:
    description: "Issue title. An open issue with this exact title gets a comment for each later run. A closed issue is not reused."
    default: "fix: failure in ${{ github.workflow }}"
    required: false
  body:
    description: "Issue body (pre-filled with run URL if omitted)"
    required: false
  notify_author:
    description: "Whether to notify the triggering author/merger on failure"
    default: "true"
  notify_codeowners:
    description: "When to notify repository CODEOWNERS on failure: always, fallback (only when no author or merger was found) or never"
    default: "fallback"
  codeowners_match:
    description: "Which CODEOWNERS rules pick owners: all (every handle in the file), changed (last matching rule for the PR's changed files; falls back to workflow without a PR) or workflow (last matching rule for the failing workflow file)"
    default: "all"
  dry_run:
    description: "If true, logs the issue create or comment without calling it"
    default: "false"


runs:
  using: "composite"
  steps:
    # Undeclared inputs fail here; GitHub only warns (input-enforcer/README.md)
    - name: Check inputs
      uses: $/input-enforcer
      with:
        inputs: ${{ toJSON(inputs) }}
        action_path: ${{ github.action_path }}

    - name: Checkout CODEOWNERS
      id: checkout_codeowners
      if: inputs.notify_codeowners != 'never' && hashFiles('.github/CODEOWNERS', 'CODEOWNERS', 'docs/CODEOWNERS', '.github/codeowners') == ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: .workflow-notifier-codeowners
        token: ${{ inputs.token }}
        persist-credentials: false
        sparse-checkout: |
          CODEOWNERS
          .github/CODEOWNERS
          .github/codeowners
          docs/CODEOWNERS
        sparse-checkout-cone-mode: false

    - name: Run Notifier
      id: run_script
      shell: bash
      env:
        INPUT_TOKEN: "${{ inputs.token }}"
        INPUT_TITLE: "${{ inputs.title }}"
        INPUT_BODY: "${{ inputs.body }}"
        INPUT_NOTIFY_AUTHOR: "${{ inputs.notify_author }}"
        INPUT_NOTIFY_CODEOWNERS: "${{ inputs.notify_codeowners }}"
        INPUT_CODEOWNERS_MATCH: "${{ inputs.codeowners_match }}"
        INPUT_EVENT_NAME: "${{ github.event_name }}"
        INPUT_DRY_RUN: "${{ inputs.dry_run }}"
        CODEOWNERS_CHECKOUT_DIR: "${{ steps.checkout_codeowners.outcome == 'success' && '.workflow-notifier-codeowners' || '' }}"
      run: |
        "${{ github.action_path }}/action.sh"

    - name: Clean up CODEOWNERS checkout
      if: always() && steps.checkout_codeowners.outcome != 'skipped'
      shell: bash
      run: rm -rf .workflow-notifier-codeowners
