name: Test and Analyze with Triggers and SonarCloud
description: Run node tests based on triggers, optional SonarCloud
branding:
  icon: check-circle
  color: blue

inputs:
  ### Required
  commands:
    description: Commands to run tests, start with '|' for multi-line
    required: true

  dir:
    description: App/package directory
    required: true

  node_version:
    description: Node version to use (e.g., '24')
    default: "24"

  java_version:
    description: Java version to use (e.g., '21')
    default: "21"

  java_distribution:
    description: Java distribution to use (e.g., temurin)
    default: "temurin"

  python_version:
    description: Python version to use (e.g., '3.12')
    default: "3.12"

  language:
    description: "Primary language of the project. Options: node (default), java, python"
    default: "node"

  ### Typical / recommended
  cache:
    description: Package manager for caching (npm, yarn, pnpm, maven, gradle, sbt, pip, poetry, pipenv). If omitted, automatically detected from project lockfiles/build files. Set to 'none' to disable caching.
    default: ""

  sonar_args:
    # https://docs.sonarcloud.io/advanced-setup/analysis-parameters/
    description: SonarCloud command line arguments
    default: |
      -Dsonar.organization=bcgov-sonarcloud
      -Dsonar.projectKey=bcgov_${{ github.repository }}

  sonar_token:
    description: Sonar token, provide unpopulated token for pre-setup (will skip)

  triggers:
    description: Paths (array) used to trigger a build; e.g. ('./backend/' './frontend/)
  debug:
    description: Enable debug logging
    default: "false"
  supply_scan:
    description: Enable supply chain attack detection using @aikidosec/safe-chain
    default: "true"

  dep_scan:
    description: "Enable dependency and export analysis using Knip for JS/TS projects. Options: off (skip), warn (run but don't fail, default), error (run and fail on issues)"
    default: "warn"

  knip_config:
    description: "Path to custom Knip configuration file (relative to workspace root). If not provided, uses action's default configuration"
    default: ""

  ### Usually a bad idea / not recommended
  ref:
    description: Reference to compare against (e.g. branch name, tag, or commit SHA)
    default: ${{ github.event.repository.default_branch }}


  repository:
    description: >-
      Non-default repository to clone (used for testing this action).
      Setting this to anything but the current repository forces a clone,
      since the workspace cannot be assumed to hold it already.
    default: ${{ github.repository }}
  github_token:
    description: Specify token (GH or PAT), instead of inheriting one from the calling workflow
    default: ${{ github.token }}

  branch:
    description: Non-default branch to clone (used for testing this action)
    default: ""

  checkout_path:
    description: >-
      Path where the repository should be checked out, and the path probed to
      decide whether a clone is needed at all. Default is current directory.
    default: "."

  require_sonar:
    description: "Fail the workflow if sonar_token is not provided, instead of silently skipping."
    default: "false"

outputs:
  triggered:
    description: Whether the action was triggered based on path changes
    value: ${{ steps.final_triggered.outputs.triggered }}
  unused_files:
    description: Number of unused files found by Knip
    value: ${{ steps.reporter_logic.outputs.unused_files }}
  unused_deps:
    description: Number of unused dependencies found by Knip
    value: ${{ steps.reporter_logic.outputs.unused_deps }}
  total_issues:
    description: Total number of issues found by Knip
    value: ${{ steps.reporter_logic.outputs.total_issues }}
  knip_config:
    description: The Knip configuration file that was auto-discovered or specified
    value: ${{ steps.knip_analysis.outputs.knip_config }}

runs:
  using: composite
  steps:
    - name: Validate Sonar Configuration
      shell: bash
      run: |
        if [ "${{ inputs.require_sonar }}" == "true" ] && [ -z "${{ inputs.sonar_token }}" ]; then
          echo "::error::sonar_token is required but was not provided. Aborting."
          exit 1
        fi

    - name: Check Triggers
      if: github.event_name == 'pull_request' && inputs.triggers != ''
      uses: $/diff-triggers
      id: diff
      with:
        triggers: ${{ inputs.triggers }}
        ref: ${{ inputs.ref }}
        github_token: ${{ inputs.github_token }}

    # Final triggered state
    - id: final_triggered
      shell: bash
      run: |
        TRIGGERED="true"
        if [ "${{ github.event_name == 'pull_request' && inputs.triggers != '' }}" == "true" ]; then
          TRIGGERED="${{ steps.diff.outputs.triggered }}"
        fi
        echo "triggered=$TRIGGERED" >> $GITHUB_OUTPUT
        echo "FINAL TRIGGERED: $TRIGGERED"


    - name: Setup Supply Chain Scan
      if: steps.final_triggered.outputs.triggered == 'true' && inputs.supply_scan == 'true' && inputs.language == 'node'
      shell: bash
      continue-on-error: true # Don't let a setup-ci issue kill the whole run
      run: |
        npx -y @aikidosec/safe-chain setup-ci


    # Clone when the caller asked for a repository other than this one, or when
    # checkout_path holds none. A bare .git probe cannot decide: Check Triggers
    # above may already have left a clone of *this* repo in the workspace, and
    # skipping on that would analyse the wrong project.
    - name: Internal Project Checkout
      uses: actions/checkout@v7
      if: >-
        steps.final_triggered.outputs.triggered == 'true' &&
        (inputs.repository != github.repository ||
        hashFiles(format('{0}/.git/HEAD', inputs.checkout_path), format('{0}/.git', inputs.checkout_path)) == '')
      with:
        clean: false
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.branch }}
        token: ${{ inputs.github_token }}
        path: ${{ inputs.checkout_path }}
        fetch-depth: 0

    # Sonar reads the repo enclosing projectBaseDir (inputs.dir) for blame and
    # new-code detection, and a caller's own checkout is usually depth 1.
    # Deepen in place rather than re-cloning over them.
    - name: Deepen shallow history
      if: >-
        steps.final_triggered.outputs.triggered == 'true' &&
        hashFiles(format('{0}/.git/HEAD', inputs.checkout_path), format('{0}/.git', inputs.checkout_path)) != ''
      shell: bash
      working-directory: ${{ inputs.checkout_path }}
      run: |
        # A worktree keeps its shallow marker in the main repo's gitdir, so probe
        # git rather than looking for .git/shallow here.
        if [ "$(git rev-parse --is-shallow-repository 2>/dev/null || echo false)" = "true" ]; then
          git fetch --unshallow
        fi

    - name: Determine Cache Type
      id: cache_logic
      if: steps.final_triggered.outputs.triggered == 'true'
      shell: bash
      env:
        INPUT_CACHE: ${{ inputs.cache }}
        INPUT_LANGUAGE: ${{ inputs.language }}
        INPUT_DIR: ${{ inputs.dir }}
        INPUT_CHECKOUT_PATH: ${{ inputs.checkout_path }}
      run: |
        "${{ github.action_path }}/cache.sh"

    - name: Setup Node.js
      uses: actions/setup-node@v7
      if: steps.final_triggered.outputs.triggered == 'true' && inputs.language == 'node'
      with:
        node-version: ${{ inputs.node_version }}
        cache: ${{ steps.cache_logic.outputs.cache }}
        cache-dependency-path: |
          ${{ inputs.dir }}/${{ steps.cache_logic.outputs.cache == 'yarn' && 'yarn.lock' || (steps.cache_logic.outputs.cache == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json') }}
          ${{ inputs.checkout_path }}/${{ steps.cache_logic.outputs.cache == 'yarn' && 'yarn.lock' || (steps.cache_logic.outputs.cache == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json') }}

    # Condition 2: Java Project Setup
    - name: Setup Java
      uses: actions/setup-java@v6
      if: steps.final_triggered.outputs.triggered == 'true' && inputs.language == 'java'
      with:
        java-version: ${{ inputs.java_version }}
        distribution: ${{ inputs.java_distribution }}
        cache: ${{ steps.cache_logic.outputs.cache }}
        cache-dependency-path: |
          ${{ inputs.dir }}/**/*.xml
          ${{ inputs.dir }}/**/*.gradle*
          ${{ inputs.dir }}/**/sbt

    # Condition 3: Python Project Setup
    - name: Setup Python
      uses: actions/setup-python@v7
      if: steps.final_triggered.outputs.triggered == 'true' && inputs.language == 'python'
      with:
        python-version: ${{ inputs.python_version }}
        cache: ${{ steps.cache_logic.outputs.cache }}
        cache-dependency-path: |
          ${{ inputs.dir }}/**/requirements*.txt
          ${{ inputs.dir }}/**/pyproject.toml
          ${{ inputs.dir }}/**/Pipfile.lock

    # Run tests
    - if: steps.final_triggered.outputs.triggered == 'true'
      shell: bash
      working-directory: ${{ inputs.dir }}
      env:
        SONAR_TOKEN: ${{ inputs.sonar_token }}
        MAVEN_OPTS: "-Xmx2048m -Xss2m -XX:MaxMetaspaceSize=512m -Djava.awt.headless=true -XX:+HeapDumpOnOutOfMemoryError"
        _JAVA_OPTIONS: "-Xmx2048m -Xss2m"
      run: |
        set +e
        ${{ inputs.commands }} > test_output.log 2>&1
        CMD_EXIT_CODE=$?
        cat test_output.log
        set -e
        if [ $CMD_EXIT_CODE -ne 0 ]; then
          echo "TEST_FAIL_SIGNAL=true" >> $GITHUB_ENV
        fi
        exit 0 # Allow the next step (reporter) to run

    ### Optional SonarCloud
    - if: inputs.sonar_token != '' && steps.final_triggered.outputs.triggered == 'true' && inputs.language != 'java'
      uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
      env:
        SONAR_TOKEN: ${{ inputs.sonar_token }}
      with:
        projectBaseDir: ${{ inputs.dir }}
        args: >
          ${{ inputs.sonar_args }}

    # Run Analysis Tools (Knip for Node, Test Reports for others)
    - name: Knip Dependency Analysis
      id: knip_analysis
      if: steps.final_triggered.outputs.triggered == 'true' && inputs.dep_scan != 'off' && inputs.language == 'node'
      working-directory: ${{ inputs.dir }}
      shell: bash
      run: |
        # Set config
        if [ -n "${{ inputs.knip_config }}" ]; then
          KNIP_CONFIG="--config=${{ github.workspace }}/${{ inputs.knip_config }}"
          echo "knip_config=${{ github.workspace }}/${{ inputs.knip_config }}" >> $GITHUB_OUTPUT
        else
          FOUND_CONFIG=""
          WORKSPACE_PATH=$(git rev-parse --show-toplevel 2>/dev/null || echo "${{ github.workspace }}")

          # 1. Candidate config files in the current app/package directory (inputs.dir)
          APP_CANDIDATES=(
            "knip.json"
            ".knip.json"
            "knip.jsonc"
            ".knip.jsonc"
            "knip.ts"
            "knip.js"
            "knip.config.ts"
            "knip.config.js"
          )
          for file in "${APP_CANDIDATES[@]}"; do
            if [ -f "$file" ]; then
              FOUND_CONFIG="$file"
              break
            fi
          done

          # Check package.json in the current app/package directory for "knip" key
          if [ -z "$FOUND_CONFIG" ] && [ -f "package.json" ]; then
            if node -e 'try { const pkg = JSON.parse(require("node:fs").readFileSync("package.json", "utf8")); process.exit(pkg.knip !== undefined ? 0 : 1); } catch { process.exit(1); }'; then
              FOUND_CONFIG="package.json"
            fi
          fi

          # 2. Check .github configuration in the workspace root
          if [ -z "$FOUND_CONFIG" ]; then
            GITHUB_CANDIDATES=(
              ".github/knip.json"
              ".github/.knip.json"
              ".github/knip.jsonc"
              ".github/.knip.jsonc"
            )
            for file in "${GITHUB_CANDIDATES[@]}"; do
              if [ -f "$WORKSPACE_PATH/$file" ]; then
                FOUND_CONFIG="$WORKSPACE_PATH/$file"
                break
              fi
            done
          fi

          # 3. Check standard configuration files in the workspace root (only if workspace root is different from inputs.dir)
          if [ -z "$FOUND_CONFIG" ] && [ "$(pwd)" != "$WORKSPACE_PATH" ]; then
            for file in "${APP_CANDIDATES[@]}"; do
              if [ -f "$WORKSPACE_PATH/$file" ]; then
                FOUND_CONFIG="$WORKSPACE_PATH/$file"
                break
              fi
            done

            if [ -z "$FOUND_CONFIG" ] && [ -f "$WORKSPACE_PATH/package.json" ]; then
              if node -e 'try { const pkg = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); process.exit(pkg.knip !== undefined ? 0 : 1); } catch { process.exit(1); }' "$WORKSPACE_PATH/package.json"; then
                FOUND_CONFIG="$WORKSPACE_PATH/package.json"
              fi
            fi
          fi

          if [ -n "$FOUND_CONFIG" ]; then
            KNIP_CONFIG="--config=$FOUND_CONFIG"
            echo "Auto-discovered Knip configuration: $FOUND_CONFIG"
            echo "knip_config=$FOUND_CONFIG" >> $GITHUB_OUTPUT
          else
            KNIP_CONFIG="--config=${{ github.action_path }}/.knip.json --no-config-hints"
            echo "No Knip configuration found. Using default configuration."
            echo "knip_config=default" >> $GITHUB_OUTPUT
          fi
        fi

        # Run knip using npx
        set +e
        npx -y knip --dependencies --exports --reporter json --no-progress ${KNIP_CONFIG} > knip-output.json
        KNIP_EXIT_CODE=$?
        npx -y knip --dependencies --exports ${KNIP_CONFIG} | sed 's/\u001b\[[0-9;]*[a-zA-Z]//g' > knip-summary.txt 2>&1
        set -e

    - name: Process Reports and Analysis
      id: reporter_logic
      if: steps.final_triggered.outputs.triggered == 'true' && (success() || failure())
      working-directory: ${{ inputs.dir }}
      shell: bash
      run: |
        # Process results with the bundled action script (shared logic)
        export INPUT_DIR="${{ inputs.dir }}"
        export INPUT_DEP_SCAN="${{ inputs.dep_scan }}"
        export INPUT_KNIP_OUTPUT="knip-output.json"
        export INPUT_LANGUAGE="${{ inputs.language }}"
        
        node ${{ github.action_path }}/dist/index.js

    - name: Final cleanup
      if: always() && inputs.repository != github.repository
      shell: bash
      run: echo "Cleanup complete"
