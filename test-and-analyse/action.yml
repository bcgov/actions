name: Test and Analyze with Triggers and SonarCloud
description: Run node tests based on triggers, optional SonarCloud
branding:
  icon: check-circle
  color: blue

inputs:
  ### Required
  commands:
    description: Commands to run tests, start with '|' for multi-line
    required: true

  working_directory:
    description: App/package directory
    required: true

  node_version:
    description: >-
      Node version to use (e.g., '24', 'lts/*'). If omitted, automatically
      detected from project files (.node-version, .nvmrc, Dockerfile, package.json).
    default: ""


  java_version:
    description: >-
      Java version to use (e.g., '21', '17'). If omitted, automatically
      detected from project files (.java-version, .sdkmanrc, .tool-versions,
      pom.xml, Gradle, Dockerfile).
    default: ""


  java_distribution:
    description: Java distribution to use (e.g., temurin)
    default: "temurin"

  python_version:
    description: >-
      Python version to use (e.g., '3.12', '3.14'). If omitted, automatically
      detected from project files (.python-version, pyproject.toml, Dockerfile, Pipfile).
    default: ""


  language:
    description: "Primary language of the project. Options: node (default), java, python"
    default: "node"

  ### Typical / recommended
  cache:
    description: Package manager for caching (npm, yarn, pnpm, maven, gradle, sbt, pip, poetry, pipenv). If omitted, automatically detected from project lockfiles/build files. Set to 'none' to disable caching.
    default: ""

  sonar_args:
    # https://docs.sonarcloud.io/advanced-setup/analysis-parameters/
    description: SonarCloud command line arguments
    default: |
      -Dsonar.organization=bcgov-sonarcloud
      -Dsonar.projectKey=bcgov_${{ github.repository }}

  sonar_token:
    description: >-
      Sonar token. Empty skips Sonar with a warning (e.g. fork PRs, which get no secrets).

  triggers:
    description: |
      Paths used to trigger a build. Prefer multiline:
        triggers: |
          backend/
          frontend/
      A single path also works. See diff-triggers.
  supply_scan:
    description: Enable supply chain attack detection using @aikidosec/safe-chain
    default: "true"

  knip:
    description: "Knip dependency and export analysis for JS/TS projects. Options: off (skip), warn (run but don't fail, default), error (run and fail on issues)"
    default: "warn"

  knip_config:
    description: "Path to custom Knip configuration file (relative to workspace root). If not provided, uses action's default configuration"
    default: ""

  semgrep:
    description: "Run a Semgrep scan of working_directory (true/false). Off by default. Needs Docker on the runner"
    default: "false"

  semgrep_config:
    description: "Semgrep rules, one per line: registry rulesets (e.g. p/default) or rule files relative to the workspace root"
    default: "p/default"

  semgrep_fail:
    description: "Fail the action when Semgrep reports findings (true/false). Default false: findings are warnings"
    default: "false"

  ### Usually a bad idea / not recommended
  base:
    description: Base to diff triggers against (branch, tag, or commit SHA). Empty uses the diff-triggers default (PR base branch, or HEAD^ on push).
    required: false


  token:
    description: 'Authentication token (defaults to github.token; override with PAT if needed).'
    default: ${{ github.token }}
    required: false



outputs:
  triggered:
    description: Whether the action was triggered based on path changes
    value: ${{ steps.final_triggered.outputs.triggered }}
  knip_config:
    description: The Knip configuration file that was auto-discovered or specified
    value: ${{ steps.knip_analysis.outputs.knip_config }}
  semgrep_findings:
    description: Number of Semgrep findings (empty when the scan did not run)
    value: ${{ steps.semgrep.outputs.semgrep_findings }}
  semgrep_sarif:
    description: Path to the Semgrep SARIF report (empty when the scan did not run)
    value: ${{ steps.semgrep.outputs.semgrep_sarif }}

runs:
  using: composite
  steps:
    # Shared input rules (shared/README.md): bad values fail here with an annotation
    - name: Parse Inputs
      id: inputs
      shell: bash
      env:
        INPUT_SUPPLY_SCAN: ${{ inputs.supply_scan }}
        INPUT_SEMGREP: ${{ inputs.semgrep }}
        INPUT_SEMGREP_FAIL: ${{ inputs.semgrep_fail }}
        INPUT_KNIP: ${{ inputs.knip }}
        INPUT_LANGUAGE: ${{ inputs.language }}
        SHARED_INPUTS: ${{ github.action_path }}/../shared/inputs.js
        HAS_SONAR_TOKEN: ${{ inputs.sonar_token != '' }}
      run: |
        # Assign first so a parse error fails the step (set -e ignores failures inside echo arguments)
        supply_scan=$(node "$SHARED_INPUTS" bool supply_scan true)
        semgrep=$(node "$SHARED_INPUTS" bool semgrep false)
        semgrep_fail=$(node "$SHARED_INPUTS" bool semgrep_fail false)
        knip=$(node "$SHARED_INPUTS" enum knip off,warn,error warn)
        language=$(node "$SHARED_INPUTS" enum language node,java,python node)
        parsed="supply_scan=$supply_scan
        semgrep=$semgrep
        semgrep_fail=$semgrep_fail
        knip=$knip
        language=$language"
        echo "$parsed" | sed 's/^ *//' >> "$GITHUB_OUTPUT"
        if [ "${RUNNER_DEBUG:-}" = "1" ]; then
          echo "Parsed inputs:"; echo "$parsed" | sed 's/^ */  /'
        fi
        if [ "$HAS_SONAR_TOKEN" != "true" ]; then
          echo "::warning::sonar_token is empty, so Sonar is skipped."
        fi

    - name: Check Triggers
      id: final_triggered
      uses: $/diff-triggers
      with:
        triggers: ${{ inputs.triggers }}
        base: ${{ inputs.base }}
        token: ${{ inputs.token }}

    - name: Setup Supply Chain Scan
      if: steps.final_triggered.outputs.triggered == 'true' && steps.inputs.outputs.supply_scan == 'true' && steps.inputs.outputs.language == 'node'
      shell: bash
      continue-on-error: true # Don't let a setup-ci issue kill the whole run
      run: |
        npx -y @aikidosec/safe-chain setup-ci


    # Clone when the workspace holds no repository yet.
    - name: Internal Project Checkout
      uses: actions/checkout@v7
      if: >-
        steps.final_triggered.outputs.triggered == 'true' &&
        hashFiles('.git/HEAD', '.git') == ''
      with:
        clean: false
        token: ${{ inputs.token }}
        fetch-depth: 0

    # Sonar reads the repo enclosing projectBaseDir (inputs.working_directory) for blame and
    # new-code detection, and a caller's own checkout is usually depth 1.
    # Deepen in place rather than re-cloning over them.
    - name: Deepen shallow history
      if: >-
        steps.final_triggered.outputs.triggered == 'true' &&
        hashFiles('.git/HEAD', '.git') != ''
      shell: bash
      run: |
        # A worktree keeps its shallow marker in the main repo's gitdir, so probe
        # git rather than looking for .git/shallow here.
        if [ "$(git rev-parse --is-shallow-repository 2>/dev/null || echo false)" = "true" ]; then
          git fetch --unshallow
        fi

    - name: Determine Cache Type
      id: cache_logic
      if: steps.final_triggered.outputs.triggered == 'true'
      shell: bash
      env:
        INPUT_CACHE: ${{ inputs.cache }}
        INPUT_LANGUAGE: ${{ steps.inputs.outputs.language }}
        INPUT_DIR: ${{ inputs.working_directory }}
      run: |
        "${{ github.action_path }}/cache.sh"

    - name: Determine Node.js Version
      id: node_version_logic
      if: steps.final_triggered.outputs.triggered == 'true' && steps.inputs.outputs.language == 'node'
      shell: bash
      env:
        INPUT_NODE_VERSION: ${{ inputs.node_version }}
        INPUT_DIR: ${{ inputs.working_directory }}
      run: |
        "${{ github.action_path }}/node-version.sh"

    - name: Setup Node.js
      uses: actions/setup-node@v7
      if: steps.final_triggered.outputs.triggered == 'true' && steps.inputs.outputs.language == 'node'
      with:
        node-version: ${{ steps.node_version_logic.outputs.node_version }}
        node-version-file: ${{ steps.node_version_logic.outputs.node_version_file }}
        cache: ${{ steps.cache_logic.outputs.cache }}
        cache-dependency-path: |
          ${{ inputs.working_directory }}/${{ steps.cache_logic.outputs.cache == 'yarn' && 'yarn.lock' || (steps.cache_logic.outputs.cache == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json') }}
          ${{ steps.cache_logic.outputs.cache == 'yarn' && 'yarn.lock' || (steps.cache_logic.outputs.cache == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json') }}

    - name: Determine Java Version
      id: java_version_logic
      if: steps.final_triggered.outputs.triggered == 'true' && steps.inputs.outputs.language == 'java'
      shell: bash
      env:
        INPUT_JAVA_VERSION: ${{ inputs.java_version }}
        INPUT_DIR: ${{ inputs.working_directory }}
      run: |
        "${{ github.action_path }}/java-version.sh"

    # Condition 2: Java Project Setup
    - name: Setup Java
      uses: actions/setup-java@v6
      if: steps.final_triggered.outputs.triggered == 'true' && steps.inputs.outputs.language == 'java'
      with:
        java-version: ${{ steps.java_version_logic.outputs.java_version }}
        java-version-file: ${{ steps.java_version_logic.outputs.java_version_file }}
        distribution: ${{ inputs.java_distribution }}
        cache: ${{ steps.cache_logic.outputs.cache }}
        cache-dependency-path: |
          ${{ inputs.working_directory }}/**/*.xml
          ${{ inputs.working_directory }}/**/*.gradle*
          ${{ inputs.working_directory }}/**/sbt

    - name: Determine Python Version
      id: python_version_logic
      if: steps.final_triggered.outputs.triggered == 'true' && steps.inputs.outputs.language == 'python'
      shell: bash
      env:
        INPUT_PYTHON_VERSION: ${{ inputs.python_version }}
        INPUT_DIR: ${{ inputs.working_directory }}
      run: |
        "${{ github.action_path }}/python-version.sh"

    # Condition 3: Python Project Setup
    - name: Setup Python
      uses: actions/setup-python@v7
      if: steps.final_triggered.outputs.triggered == 'true' && steps.inputs.outputs.language == 'python'
      with:
        python-version: ${{ steps.python_version_logic.outputs.python_version }}
        python-version-file: ${{ steps.python_version_logic.outputs.python_version_file }}
        cache: ${{ steps.cache_logic.outputs.cache }}
        cache-dependency-path: |
          ${{ inputs.working_directory }}/**/requirements*.txt
          ${{ inputs.working_directory }}/**/pyproject.toml
          ${{ inputs.working_directory }}/**/Pipfile.lock

    # Run tests
    - if: steps.final_triggered.outputs.triggered == 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        SONAR_TOKEN: ${{ inputs.sonar_token }}
        MAVEN_OPTS: "-Xmx2048m -Xss2m -XX:MaxMetaspaceSize=512m -Djava.awt.headless=true -XX:+HeapDumpOnOutOfMemoryError"
        _JAVA_OPTIONS: "-Xmx2048m -Xss2m"
      run: |
        set +e
        ${{ inputs.commands }} > test_output.log 2>&1
        CMD_EXIT_CODE=$?
        cat test_output.log
        set -e
        if [ $CMD_EXIT_CODE -ne 0 ]; then
          echo "TEST_FAIL_SIGNAL=true" >> $GITHUB_ENV
        fi
        exit 0 # Allow the next step (reporter) to run

    ### Optional SonarCloud
    - if: inputs.sonar_token != '' && steps.final_triggered.outputs.triggered == 'true' && steps.inputs.outputs.language != 'java'
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8
      env:
        SONAR_TOKEN: ${{ inputs.sonar_token }}
      with:
        projectBaseDir: ${{ inputs.working_directory }}
        args: >
          ${{ inputs.sonar_args }}

    # Run Analysis Tools (Knip for Node, Test Reports for others)
    - name: Knip Dependency Analysis
      id: knip_analysis
      if: steps.final_triggered.outputs.triggered == 'true' && steps.inputs.outputs.knip != 'off' && steps.inputs.outputs.language == 'node'
      working-directory: ${{ inputs.working_directory }}
      shell: bash
      run: |
        # Set config
        if [ -n "${{ inputs.knip_config }}" ]; then
          KNIP_CONFIG="--config=${{ github.workspace }}/${{ inputs.knip_config }}"
          echo "knip_config=${{ github.workspace }}/${{ inputs.knip_config }}" >> $GITHUB_OUTPUT
        else
          FOUND_CONFIG=""
          WORKSPACE_PATH=$(git rev-parse --show-toplevel 2>/dev/null || echo "${{ github.workspace }}")

          # 1. Candidate config files in the current app/package directory (inputs.working_directory)
          APP_CANDIDATES=(
            "knip.json"
            ".knip.json"
            "knip.jsonc"
            ".knip.jsonc"
            "knip.ts"
            "knip.js"
            "knip.config.ts"
            "knip.config.js"
          )
          for file in "${APP_CANDIDATES[@]}"; do
            if [ -f "$file" ]; then
              FOUND_CONFIG="$file"
              break
            fi
          done

          # Check package.json in the current app/package directory for "knip" key
          if [ -z "$FOUND_CONFIG" ] && [ -f "package.json" ]; then
            if node -e 'try { const pkg = JSON.parse(require("node:fs").readFileSync("package.json", "utf8")); process.exit(pkg.knip !== undefined ? 0 : 1); } catch { process.exit(1); }'; then
              FOUND_CONFIG="package.json"
            fi
          fi

          # 2. Check .github configuration in the workspace root
          if [ -z "$FOUND_CONFIG" ]; then
            GITHUB_CANDIDATES=(
              ".github/knip.json"
              ".github/.knip.json"
              ".github/knip.jsonc"
              ".github/.knip.jsonc"
            )
            for file in "${GITHUB_CANDIDATES[@]}"; do
              if [ -f "$WORKSPACE_PATH/$file" ]; then
                FOUND_CONFIG="$WORKSPACE_PATH/$file"
                break
              fi
            done
          fi

          # 3. Check standard configuration files in the workspace root (only if workspace root is different from inputs.working_directory)
          if [ -z "$FOUND_CONFIG" ] && [ "$(pwd)" != "$WORKSPACE_PATH" ]; then
            for file in "${APP_CANDIDATES[@]}"; do
              if [ -f "$WORKSPACE_PATH/$file" ]; then
                FOUND_CONFIG="$WORKSPACE_PATH/$file"
                break
              fi
            done

            if [ -z "$FOUND_CONFIG" ] && [ -f "$WORKSPACE_PATH/package.json" ]; then
              if node -e 'try { const pkg = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); process.exit(pkg.knip !== undefined ? 0 : 1); } catch { process.exit(1); }' "$WORKSPACE_PATH/package.json"; then
                FOUND_CONFIG="$WORKSPACE_PATH/package.json"
              fi
            fi
          fi

          if [ -n "$FOUND_CONFIG" ]; then
            KNIP_CONFIG="--config=$FOUND_CONFIG"
            echo "Auto-discovered Knip configuration: $FOUND_CONFIG"
            echo "knip_config=$FOUND_CONFIG" >> $GITHUB_OUTPUT
          else
            KNIP_CONFIG="--config=${{ github.action_path }}/.knip.json --no-config-hints"
            echo "No Knip configuration found. Using default configuration."
            echo "knip_config=default" >> $GITHUB_OUTPUT
          fi
        fi

        # Run knip using npx
        set +e
        npx -y knip --dependencies --exports --reporter json --no-progress ${KNIP_CONFIG} > knip-output.json
        KNIP_EXIT_CODE=$?
        npx -y knip --dependencies --exports ${KNIP_CONFIG} | sed 's/\u001b\[[0-9;]*[a-zA-Z]//g' > knip-summary.txt 2>&1
        set -e

    - name: Semgrep Scan
      id: semgrep
      if: steps.final_triggered.outputs.triggered == 'true' && steps.inputs.outputs.semgrep == 'true' && (success() || failure())
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        SEMGREP_IMAGE: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
        INPUT_SEMGREP_CONFIG: ${{ inputs.semgrep_config }}
        INPUT_SEMGREP_FAIL: ${{ steps.inputs.outputs.semgrep_fail }}
      run: |
        "${{ github.action_path }}/semgrep.sh"

    # Composite stays: this action installs the caller's toolchain and runs their
    # commands, Sonar and Knip. The reporter is a node24 action, so it uses the
    # Actions runtime instead of the project's node_version. Node is installed
    # once, for the caller's code.
    - name: Process Reports and Analysis
      id: reporter_logic
      if: steps.final_triggered.outputs.triggered == 'true' && (success() || failure())
      uses: $/test-and-analyse/reporter
      with:
        dir: ${{ inputs.working_directory }}
        knip: ${{ steps.inputs.outputs.knip }}
        knip_output: knip-output.json
        language: ${{ steps.inputs.outputs.language }}
