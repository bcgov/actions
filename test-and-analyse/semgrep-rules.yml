# High/Critical semantic security rules aligned with bcgov/action-repo-reporter
# (`scripts/analyze-semantic-domains.py`) so template repositories surface the
# same classes of issues on pull requests.
rules:
  - id: bcgov-raw-http-error-logging
    languages: [javascript, typescript]
    severity: WARNING
    message: Avoid logging raw HTTP client error objects (may expose Authorization headers or Bearer tokens); log error.message or error.code instead.
    metadata:
      cwe: ["CWE-532"]
      category: security
    patterns:
      - pattern-inside: |
          try {
            ...
            $HTTP(...)
            ...
          } catch ($ERR) {
            ...
          }
      - metavariable-regex:
          metavariable: $HTTP
          regex: ^(?:axios(?:\.\w+)?|fetch)$
      - pattern-either:
          - pattern: console.$LOG(..., $ERR, ...)
          - pattern: logger.$LOG(..., $ERR, ...)
          - pattern: console.$LOG(..., $ERR.config, ...)
          - pattern: logger.$LOG(..., $ERR.config, ...)

  - id: bcgov-credential-logging
    languages: [javascript, typescript]
    severity: ERROR
    message: Avoid logging credential variables or authorization headers directly in application logs.
    metadata:
      cwe: ["CWE-532"]
      category: security
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: console.$LOG(..., $VAR, ...)
              - pattern: logger.$LOG(..., $VAR, ...)
          - metavariable-regex:
              metavariable: $VAR
              regex: ^(?:accessToken|refreshToken|clientSecret|client_secret|bearerToken)$
      - patterns:
          - pattern-either:
              - pattern: console.$LOG(`...${$VAR}...`)
              - pattern: logger.$LOG(`...${$VAR}...`)
          - metavariable-regex:
              metavariable: $VAR
              regex: ^(?:accessToken|refreshToken|clientSecret|client_secret|bearerToken)$
      - pattern: console.$LOG(..., $REQ.headers.authorization, ...)
      - pattern: logger.$LOG(..., $REQ.headers.authorization, ...)
      - pattern: console.$LOG(..., $REQ.headers["authorization"], ...)
      - pattern: logger.$LOG(..., $REQ.headers["authorization"], ...)

  - id: bcgov-weak-secret-fallback-js
    languages: [javascript, typescript]
    severity: ERROR
    message: Hardcoded fallback value for secret/key/token environment variable ($ENV); fail closed instead.
    metadata:
      cwe: ["CWE-798"]
      category: security
    patterns:
      - pattern-either:
          - pattern: process.env.$ENV || "$FALLBACK"
          - pattern: process.env.$ENV ?? "$FALLBACK"
      - metavariable-regex:
          metavariable: $ENV
          regex: (?i).*(?:JWT|SECRET|TOKEN|ENCRYPTION_KEY|PRIVATE_KEY).*
      - metavariable-regex:
          metavariable: $FALLBACK
          regex: .+

  - id: bcgov-weak-secret-fallback-py
    languages: [python]
    severity: ERROR
    message: Hardcoded fallback value for secret/key/token environment variable ($ENV); fail closed instead.
    metadata:
      cwe: ["CWE-798"]
      category: security
    patterns:
      - pattern-either:
          - pattern: os.environ.get("$ENV", "$FALLBACK")
          - pattern: os.getenv("$ENV", "$FALLBACK")
          - pattern: os.environ.get("$ENV") or "$FALLBACK"
          - pattern: os.getenv("$ENV") or "$FALLBACK"
          - pattern: os.environ["$ENV"] or "$FALLBACK"
      - metavariable-regex:
          metavariable: $ENV
          regex: (?i).*(?:JWT|SECRET|TOKEN|ENCRYPTION_KEY|PRIVATE_KEY).*
      - metavariable-regex:
          metavariable: $FALLBACK
          regex: .+

  - id: bcgov-jwt-verify-unpinned-algorithm
    languages: [javascript, typescript]
    severity: ERROR
    message: "jwt.verify() without an explicit algorithms allowlist risks algorithm confusion attacks; pin algorithms (e.g. { algorithms: ['RS256'] })."
    metadata:
      cwe: ["CWE-347"]
      category: security
    pattern-either:
      - pattern: jwt.verify($TOKEN, $KEY)
      - patterns:
          - pattern: 'jwt.verify($TOKEN, $KEY, { ... })'
          - pattern-not: 'jwt.verify($TOKEN, $KEY, { algorithms: ..., ... })'

  - id: bcgov-express-unprotected-mutation
    languages: [javascript, typescript]
    severity: WARNING
    message: State-changing Express route lacks an inline authentication middleware.
    metadata:
      cwe: ["CWE-306"]
      category: security
    patterns:
      - pattern: $R.$M("$PATH", $HANDLER)
      - metavariable-regex:
          metavariable: $R
          regex: ^(?:router|app)$
      - metavariable-regex:
          metavariable: $M
          regex: ^(?:post|put|patch|delete)$
      - metavariable-regex:
          metavariable: $PATH
          regex: ^/(?!.*(?:^|/)(?:login|logout|signin|signup|register|auth|callback|refresh|health|healthz|ready|live|metrics|webhook|public)(?:/|$)).*$
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: |
                    $R.use($MW)
                    ...
                - pattern: |
                    $R.use($PREFIX, $MW)
                    ...
            - metavariable-regex:
                metavariable: $MW
                regex: (?i).*(?:auth|authenticate|jwt|verify|guard|checkRole|isLoggedIn|passport).*

  - id: bcgov-nestjs-unprotected-mutation
    languages: [typescript]
    severity: WARNING
    message: State-changing NestJS controller method lacks an authentication or role guard (@UseGuards, @Roles, @Auth, or @Public).
    metadata:
      cwe: ["CWE-306"]
      category: security
    patterns:
      - pattern-inside: |
          @Controller(...)
          class $CLS {
            ...
          }
      - pattern-not-inside: |
          @UseGuards(...)
          class $CLS {
            ...
          }
      - pattern-not-inside: |
          @Roles(...)
          class $CLS {
            ...
          }
      - pattern-not-inside: |
          @Auth(...)
          class $CLS {
            ...
          }
      - pattern: |
          @$VERB(...)
          $METHOD(...) {
            ...
          }
      - metavariable-regex:
          metavariable: $VERB
          regex: ^(?:Post|Put|Patch|Delete)$
      - pattern-not: |
          @UseGuards(...)
          $METHOD(...) {
            ...
          }
      - pattern-not: |
          @Roles(...)
          $METHOD(...) {
            ...
          }
      - pattern-not: |
          @Auth(...)
          $METHOD(...) {
            ...
          }
      - pattern-not: |
          @Public(...)
          $METHOD(...) {
            ...
          }
      - pattern-not:
          patterns:
            - pattern: |
                @$VERB("$ROUTE")
                $METHOD(...) {
                  ...
                }
            - metavariable-regex:
                metavariable: $ROUTE
                regex: (?i)(?:^|/)(?:login|logout|token|auth|callback|public|health|healthz|webhook|register|signup)(?:/|$)

  - id: bcgov-django-unprotected-drf-view
    languages: [python]
    severity: WARNING
    message: Django REST view with state-changing handlers sets empty or AllowAny permission_classes; enforce explicit authentication/permission checks.
    metadata:
      cwe: ["CWE-306"]
      category: security
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  class $VIEW(...):
                    ...
                    def $MUT(self, ...):
                      ...
              - metavariable-regex:
                  metavariable: $MUT
                  regex: ^(?:post|put|patch|delete|create|update|partial_update|destroy)$
          - patterns:
              - pattern-inside: |
                  class $VIEW($BASE):
                    ...
              - metavariable-regex:
                  metavariable: $BASE
                  regex: ^.*ModelViewSet$
      - pattern-either:
          - pattern: permission_classes = []
          - pattern: permission_classes = [..., AllowAny, ...]
