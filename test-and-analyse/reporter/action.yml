name: Process reports and analysis
description: Summarize test and dependency analysis results on the Actions Node 24 runtime
inputs:
  dir:
    description: App/package directory, relative to the workspace unless absolute
    required: true
  unused_deps:
    description: "Dependency analysis mode: off, warn, or error"
    default: "warn"
  knip_output:
    description: Knip JSON path, relative to dir
    default: knip-output.json
  language:
    description: "Primary language: node, java, or python"
    default: node
runs:
  using: node24
  main: index.mjs
