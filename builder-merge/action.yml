name: Builder Merge
description: Combine builder's canonical amd64 image and its per-architecture images (e.g. -arm64) into a separate multi-arch tag on ghcr.io, without touching the canonical tags.
branding:
  icon: layers
  color: blue

inputs:
  ### Required
  package:
    description: Package name, as passed to builder; e.g. backend, frontend
    required: true

  ### Typical / recommended
  tags:
    default: ${{ github.event.number }}
    description: |
      Tag(s) passed to builder. Defaults to PR number in pull_request workflows.
      The source commit SHA is always added.
  architectures:
    default: arm64
    description: |
      Architectures built by builder with its architecture input (tagged <tag>-<arch>), one per
      line or comma-separated. They're combined with the canonical amd64 image (<tag>).
  tag_suffix:
    default: -multiarch
    description: |
      Suffix for the published multi-arch tags (<tag>-multiarch, <sha>-multiarch). The
      canonical tags stay amd64 for deploys; this tag is for pulling natively on any machine.
  source_sha:
    description: |
      Source commit SHA the images were tagged with (builder's source_sha output).
      Only needed for builds from an external repository; defaults to the PR head or github.sha.

  ### Usually a bad idea / not recommended
  token:
    description: 'Authentication token (defaults to github.token; override with PAT if needed).'
    default: ${{ github.token }}
    required: false
  username:
    description: Username for registry login; defaults to github.actor
    default: ${{ github.actor }}

outputs:
  digest:
    description: Digest of the multi-arch index
    value: ${{ steps.merge.outputs.digest }}
  image_path:
    description: "Multi-arch image path with its first tag, in the format `/owner/repo/image:tag-multiarch`, as for builder"
    value: ${{ steps.merge.outputs.image_path }}

runs:
  using: composite
  steps:
    # Same image path, tag and fork rules as builder, from the same helpers
    - id: vars
      shell: bash
      env:
        INPUT_PACKAGE: ${{ inputs.package }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_ARCHITECTURES: ${{ inputs.architectures }}
        INPUT_TAG_SUFFIX: ${{ inputs.tag_suffix }}
        INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
        EVENT_NAME: ${{ github.event_name }}
        GH_REPOSITORY: ${{ github.repository }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EVENT_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        # shellcheck source=../builder/context.sh
        source "${{ github.action_path }}/../builder/context.sh"

        if [ -z "${INPUT_TAGS}" ]; then
          echo "::error::Required input 'tags' was not provided (and no pull request number is available for event '${EVENT_NAME}'). Please provide explicit 'tags'."
          exit 1
        fi
        if [ -z "${INPUT_TAG_SUFFIX}" ] || [[ ! "${INPUT_TAG_SUFFIX}" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "::error::Input 'tag_suffix' (${INPUT_TAG_SUFFIX}) must be non-empty, so the canonical tags are never overwritten, and use only letters, digits, '.', '_' and '-'."
          exit 1
        fi

        # Each architecture's tag suffix, using builder's own rule (arm64 -> -arm64)
        suffixes=""
        for arch in ${INPUT_ARCHITECTURES//,/ }; do
          if ! suffix="$(architecture_tag_suffix "${arch}")" || [ -z "${suffix}" ]; then
            echo "::error::Input 'architectures' has '${arch}'. List only architectures built with builder's architecture input, e.g. arm64; amd64 is the canonical image and is always included."
            exit 1
          fi
          suffixes+="${suffix}"$'\n'
        done
        if [ -z "${suffixes}" ]; then
          echo "::error::Input 'architectures' is empty; list at least one, e.g. arm64."
          exit 1
        fi

        publish_repo="$(publish_repository "${EVENT_NAME}" "${GH_REPOSITORY}" "${HEAD_REPO}")"
        image_path="$(image_path_for "${INPUT_PACKAGE}" "${publish_repo}" "${publish_repo##*/}")"
        sha="${INPUT_SOURCE_SHA:-$(source_sha "${HEAD_SHA}" "${EVENT_SHA}")}"
        if can_push_packages "${EVENT_NAME}" "${GH_REPOSITORY}" "${HEAD_REPO}"; then
          can_push=true
        else
          can_push=false
          echo "::notice::Fork pull_request cannot push to GHCR, so builder only validated the builds and there is nothing to merge."
        fi

        echo "image=ghcr.io/${image_path}" >> "$GITHUB_OUTPUT"
        echo "can_push=${can_push}" >> "$GITHUB_OUTPUT"
        {
          echo "tags<<EOF"
          merge_sha_tag "${INPUT_TAGS}" "${sha}"
          echo "EOF"
          echo "suffixes<<EOF"
          printf '%s' "${suffixes}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Log in to the Container registry
      if: steps.vars.outputs.can_push == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ inputs.username }}
        password: ${{ inputs.token }}

    - name: Merge architectures
      id: merge
      if: steps.vars.outputs.can_push == 'true'
      shell: bash
      env:
        IMAGE: ${{ steps.vars.outputs.image }}
        TAGS: ${{ steps.vars.outputs.tags }}
        SUFFIXES: ${{ steps.vars.outputs.suffixes }}
        OUTPUT_SUFFIX: ${{ inputs.tag_suffix }}
      run: |
        set -euo pipefail
        first=$(printf '%s\n' "${TAGS}" | head -n 1)
        digest_of() { docker buildx imagetools inspect "$1" | awk '/^Digest:/ {print $2}'; }

        # The canonical amd64 image (<tag>) plus each architecture's image (<tag>-arm64)
        sources=()
        while IFS= read -r suffix; do
          ref="${IMAGE}:${first}${suffix}"
          if ! digest=$(digest_of "${ref}") || [ -z "${digest}" ]; then
            echo "::error::${ref} not found. Did builder run${suffix:+ with architecture: ${suffix#-}} for this commit?"
            exit 1
          fi
          sources+=("${IMAGE}@${digest}")
        done < <(printf '\n%s' "${SUFFIXES}")

        # Separate -multiarch tags only; the canonical tags stay amd64 for deploys
        args=()
        while IFS= read -r tag; do
          args+=(--tag "${IMAGE}:${tag}${OUTPUT_SUFFIX}")
        done <<< "${TAGS}"
        docker buildx imagetools create "${args[@]}" "${sources[@]}"

        digest=$(digest_of "${IMAGE}:${first}${OUTPUT_SUFFIX}")
        archs=$(docker buildx imagetools inspect --raw "${IMAGE}@${digest}" | jq -c '[.manifests[]? | select(.platform.os != "unknown") | .platform.architecture] | sort')
        echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        echo "image_path=${IMAGE#ghcr.io}:${first}${OUTPUT_SUFFIX}" >> "$GITHUB_OUTPUT"
        {
          echo "### Multi-arch image"
          echo "| Output | Value |"
          echo "| --- | --- |"
          echo "| **image** | \`${IMAGE}:${first}${OUTPUT_SUFFIX}\` |"
          echo "| **digest** | \`${digest}\` |"
          echo "| **architectures** | \`${archs}\` |"
        } >> "$GITHUB_STEP_SUMMARY"
