name: 'Image Tracker'
description: 'Forensic history traversal to resolve stable image SHAs from squash-merged commits.'

inputs:
  package:
    description: |
      One or more package names (space, comma, or newline separated).
      If omitted, the action only resolves PR metadata.
    required: false
  max_depth:
    description: 'Max commits to walk back'
    default: '100'
  token:
    description: 'GitHub token (defaults to github.token)'
    default: ${{ github.token }}
  repository:
    description: 'Repository to resolve against (defaults to current repo)'
    default: ${{ github.repository }}
  dir:
    description: 'Directory containing the git repository'
    default: '.'
  revision:
    description: 'Starting revision to walk back from (Tag, Branch, or SHA)'
    default: 'HEAD'
  inventory_depth:
    description: 'If set, the action performs an audit walk of exactly this many commits and reports all found images. (Walks back X commits; does not stop at first match).'
    required: false
  cosign:
    description: 'If true, verifies image signatures using Cosign.'
    default: 'false'
  cosign_public_key:
    description: 'The public key for Cosign verification. If empty, uses keyless verification (requires OIDC/Sigstore).'
    required: false

outputs:
  packages:
    description: 'JSON object mapping package names to verified image tags (e.g. {"frontend":"sha-abc123"})'
    value: ${{ steps.walk.outputs.packages }}
  bundle:
    description: 'Backward-compatible alias for packages; JSON object mapping package names to verified image tags'
    value: ${{ steps.walk.outputs.packages }}
  tag:
    description: 'The resolved SHA for the first (or only) package in the list. Simplifies workflows by removing the need for jq.'
    value: ${{ steps.walk.outputs.tag }}
  inventory:
    description: 'JSON array of all found images and their metadata (PR number, merge date, etc.). Only populated if inventory_depth is set.'
    value: ${{ steps.walk.outputs.inventory }}
  pr:
    description: 'The resolved PR number for the starting revision (or the first match in history).'
    value: ${{ steps.walk.outputs.pr }}

runs:
  using: 'composite'
  steps:
    - id: walk
      shell: bash
      env:
        INPUT_PACKAGE: ${{ inputs.package }}
        INPUT_MAX_DEPTH: ${{ inputs.max_depth }}
        INPUT_DIR: ${{ inputs.dir }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_REVISION: ${{ inputs.revision }}
        INPUT_INVENTORY_DEPTH: ${{ inputs.inventory_depth }}
        INPUT_COSIGN: ${{ inputs.cosign }}
        INPUT_COSIGN_PUBLIC_KEY: ${{ inputs.cosign_public_key }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash ${{ github.action_path }}/action.sh
