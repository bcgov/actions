name: 'Image Tracker'
description: 'Resolve GHCR image digests for a git commit using OCI revision labels.'

inputs:
  package:
    description: |
      One or more package names (comma, space, or newline separated).
      Each resolves to `ghcr.io/<owner>/<repo>/<package>`, except when the
      package name matches the repo name, in which case it resolves to
      `ghcr.io/<owner>/<repo>`.
    required: true
  revision:
    description: 'Git revision (SHA, branch, or tag) to resolve against.'
    default: 'HEAD'
  repository:
    description: 'Repository owning the images (defaults to current).'
    default: ${{ github.repository }}
  dir:
    description: 'Working directory containing the git repository.'
    default: '.'
  token:
    description: 'GitHub token for GHCR auth (defaults to github.token).'
    default: ${{ github.token }}
  max_tags:
    description: 'Upper bound on tags inspected per package before failing.'
    default: '500'

outputs:
  images:
    description: |
      JSON object mapping each package to its fully-qualified digest reference:
      `{"frontend": "ghcr.io/owner/repo/frontend@sha256:..."}`.
    value: ${{ steps.resolve.outputs.images }}
  digests:
    description: |
      JSON object mapping each package to its manifest digest only:
      `{"frontend": "sha256:..."}`.
    value: ${{ steps.resolve.outputs.digests }}
  image:
    description: |
      Convenience — fully-qualified digest reference for the first (or only)
      package. Empty if nothing was resolved.
    value: ${{ steps.resolve.outputs.image }}
  digest:
    description: |
      Convenience — manifest digest for the first (or only) package.
      Empty if nothing was resolved.
    value: ${{ steps.resolve.outputs.digest }}

runs:
  using: 'composite'
  steps:
    - id: resolve
      shell: bash
      env:
        INPUT_PACKAGE: ${{ inputs.package }}
        INPUT_REVISION: ${{ inputs.revision }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_DIR: ${{ inputs.dir }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_MAX_TAGS: ${{ inputs.max_tags }}
      run: bash ${{ github.action_path }}/action.sh
