# ponytail: actionlint 1.7.x does not yet recognize GitHub's $/ self-repository syntax.
# Remove when rhysd/actionlint adds support. Bundled here so pr-validate sparse checkouts still load it.
paths:
  '**/*.{yml,yaml}':
    ignore:
      - 'specifying action "\$/'
      - 'reusable workflow call "\$/'
