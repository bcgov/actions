name: actionlint
description: Lint GitHub Actions workflows with caching and rate-limit proof execution
branding:
  icon: shield
  color: blue

inputs:
  version:
    description: Pinned version tag of rhysd/actionlint to run (e.g. v1.7.12). Defaults to version in .tool-versions.
    default: ""
  args:
    description: Additional command line arguments to pass to actionlint
    default: ""
  debug:
    description: Enable debug logging
    default: "false"
  github_token:
    description: GitHub token
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # Convenience for callers that lint their own workspace without checking it
    # out first. Passing args means the caller arranged the paths themselves, and
    # clean would delete an arrangement it does not own (e.g. a subdirectory
    # checkout). Second hashFiles pattern catches worktrees and submodules,
    # where .git is a gitdir file rather than a directory.
    - name: Checkout repository
      if: inputs.args == '' && hashFiles('.git/HEAD', '.git') == ''
      uses: actions/checkout@v7
      with:
        clean: false

    - name: Resolve actionlint version
      id: version-resolver
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        if [ -z "${VERSION}" ]; then
          if [ -f "${{ github.workspace }}/.tool-versions" ]; then
            VERSION="v$(awk '$1 == "actionlint" {print $2}' "${{ github.workspace }}/.tool-versions")"
          elif [ -f "${{ github.action_path }}/.tool-versions" ]; then
            VERSION="v$(awk '$1 == "actionlint" {print $2}' "${{ github.action_path }}/.tool-versions")"
          elif [ -f "${{ github.action_path }}/../.tool-versions" ]; then
            VERSION="v$(awk '$1 == "actionlint" {print $2}' "${{ github.action_path }}/../.tool-versions")"
          else
            VERSION="v1.7.12"
          fi
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Cache actionlint binary
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.actionlint-bin
        key: actionlint-${{ steps.version-resolver.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Download actionlint
      if: runner.os == 'Linux' && runner.arch == 'X64' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ACTIONLINT_VERSION: ${{ steps.version-resolver.outputs.version }}
      run: |
        set -euo pipefail
        mkdir -p "${{ github.workspace }}/.actionlint-bin"
        VERSION="${ACTIONLINT_VERSION}"
        VERSION_NUM="${VERSION#v}"
        
        # Pull the archive directly from GitHub Releases (avoiding raw.githubusercontent CDN rate limits)
        if ! curl -fsSL "https://github.com/rhysd/actionlint/releases/download/${VERSION}/actionlint_${VERSION_NUM}_linux_amd64.tar.gz" | tar -xz -C "${{ github.workspace }}/.actionlint-bin" actionlint; then
          echo "::warning title=actionlint download failed::Failed to download actionlint binary from GitHub Releases. Skipping linter checks."
        fi

    - name: Run actionlint
      if: runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      env:
        ACTIONLINT_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        ACTIONLINT_BIN="${{ github.workspace }}/.actionlint-bin/actionlint"
        if [ -x "$ACTIONLINT_BIN" ]; then
          # ponytail: actionlint 1.7.x lacks GitHub's $/ self-repo syntax; drop ignores when upstream adds it
          # RE2 treats $ as EOL — escape as \$ in -ignore patterns
          "$ACTIONLINT_BIN" \
            -config-file "${{ github.action_path }}/actionlint.yaml" \
            -ignore 'specifying action "\$/' \
            -ignore 'reusable workflow call "\$/' \
            $ACTIONLINT_ARGS
        else
          echo "::warning title=actionlint missing::actionlint binary not found. Skipping linter checks."
        fi
