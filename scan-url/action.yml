name: Scan URL
description: Scan a running site's URL with ZAP and Nuclei and upload SARIF to the Security tab
branding:
  icon: shield
  color: blue

inputs:
  url:
    description: URL to scan
    required: true
  # What to scan: each scanner is on by default; at least one must stay on
  zap:
    description: Run the ZAP full scan (true or false)
    default: 'true'
  nuclei:
    description: Run the Nuclei scan (true or false)
    default: 'true'
  # Nuclei load: its defaults (150 requests/s, 25 templates at once, 10 s timeout, 1 retry)
  # trip perimeter connection-rate limits and drop the host on a single i/o timeout
  nuclei_rate_limit:
    description: Nuclei maximum requests per second (-rl)
    default: '15'
  nuclei_concurrency:
    description: Nuclei templates run in parallel (-c)
    default: '3'
  nuclei_timeout:
    description: Nuclei seconds to wait for a connection or response (-timeout)
    default: '10'
  nuclei_retries:
    description: Nuclei retries per failed request (-retries)
    default: '3'
  # Scan depth: nuclei_tags defaults to high-signal tags alongside ZAP; pass '' to run every template
  nuclei_tags:
    description: Run only Nuclei templates with these tags (-tags), one per line. Pass '' to run every template
    default: |
      misconfig
      exposure
      tech
  nuclei_templates:
    description: Run only these Nuclei templates or template directories (-t), one per line. Unset runs every template
  zap_spider_minutes:
    description: Minutes the ZAP spider may run (zap-full-scan.py -m). Unset has no limit
  zap_scan_minutes:
    description: Minutes the ZAP active scan may run (ZAP scanner.maxScanDurationInMins). Unset has no limit

outputs:
  zap_json:
    description: ZAP JSON report, relative to the workspace
    value: report_json.json
  nuclei_jsonl:
    description: Nuclei JSONL findings, relative to the workspace
    value: nuclei-results.jsonl

runs:
  using: composite
  steps:
    # Undeclared inputs fail here; GitHub only warns (input-enforcer/README.md)
    - name: Check inputs
      uses: $/input-enforcer
      with:
        inputs: ${{ toJSON(inputs) }}
        action_path: ${{ github.action_path }}

    - name: Preflight
      id: preflight
      shell: bash
      env:
        URL: ${{ inputs.url }}
        INPUT_ZAP: ${{ inputs.zap }}
        INPUT_NUCLEI: ${{ inputs.nuclei }}
        NUCLEI_RATE_LIMIT: ${{ inputs.nuclei_rate_limit }}
        NUCLEI_CONCURRENCY: ${{ inputs.nuclei_concurrency }}
        NUCLEI_TIMEOUT: ${{ inputs.nuclei_timeout }}
        NUCLEI_RETRIES: ${{ inputs.nuclei_retries }}
        INPUT_NUCLEI_TAGS: ${{ inputs.nuclei_tags }}
        INPUT_NUCLEI_TEMPLATES: ${{ inputs.nuclei_templates }}
        INPUT_ZAP_SPIDER_MINUTES: ${{ inputs.zap_spider_minutes }}
        INPUT_ZAP_SCAN_MINUTES: ${{ inputs.zap_scan_minutes }}
        SHARED_INPUTS: ${{ github.action_path }}/../shared/inputs.js
      run: |
        # Shared boolean rules (shared/README.md); a bad value fails here
        ZAP=$(node "$SHARED_INPUTS" bool zap true)
        NUCLEI=$(node "$SHARED_INPUTS" bool nuclei true)
        echo "zap=${ZAP}" >> "$GITHUB_OUTPUT"
        echo "nuclei=${NUCLEI}" >> "$GITHUB_OUTPUT"
        if [[ "$ZAP" == false && "$NUCLEI" == false ]]; then
          echo "::error::zap and nuclei are both 'false'; enable at least one scanner"
          exit 1
        fi
        for name in nuclei_rate_limit nuclei_concurrency nuclei_timeout nuclei_retries; do
          var="${name^^}"
          if [[ ! "${!var}" =~ ^[1-9][0-9]{0,3}$ ]]; then
            echo "::error::${name} must be a whole number from 1 to 9999, got '${!var}'"
            exit 1
          fi
        done
        # Optional scan-depth inputs; empty ones add no scanner flags
        bash "${GITHUB_ACTION_PATH}/options.sh" >> "$GITHUB_OUTPUT"
        if [[ ! "$URL" =~ ^https?://[[:alnum:]][[:alnum:].-]*(:[0-9]+)?(/[^[:space:]]*)?$ ]]; then
          echo "::error::url must be http(s)://host[:port][/path], got '${URL}'"
          exit 1
        fi
        # Any HTTP response passes; DNS failure, refused connection or timeout would scan nothing
        rc=0
        curl -s -o /dev/null --connect-timeout 10 --max-time 20 "$URL" || rc=$?
        if [[ "$rc" -ne 0 ]]; then
          echo "::error::url ${URL} is unreachable (curl exit ${rc})"
          exit 1
        fi
        # Per-URL names keep a caller matrix from sharing SARIF categories, artifacts and issues
        slug="$(sed -E 's#^https?://##; s#[^[:alnum:]]+#-#g; s#^-|-$##g' <<<"$URL")"
        echo "slug=${slug}" >> "$GITHUB_OUTPUT"
        # Stale reports from an earlier run would make a broken scan look clean
        rm -f report_json.json zap-results.sarif nuclei-results.jsonl nuclei-results.sarif nuclei.log
        if [[ -f tests/.zap/rules.tsv ]]; then
          echo "zap_rules=tests/.zap/rules.tsv" >> "$GITHUB_OUTPUT"
        fi

    - name: ZAP Full Scan
      id: zap
      if: steps.preflight.outputs.zap == 'true'
      continue-on-error: true
      uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
      with:
        target: ${{ inputs.url }}
        rules_file_name: ${{ steps.preflight.outputs.zap_rules }}
        cmd_options: ${{ steps.preflight.outputs.zap_cmd_options }}
        artifact_name: zap_scan-${{ steps.preflight.outputs.slug }}
        allow_issue_writing: false

    - name: Install Nuclei
      id: nuclei_install
      if: steps.preflight.outputs.nuclei == 'true'
      continue-on-error: true
      uses: projectdiscovery/nuclei-action@cc153d0541e1adf8a42bbe31c0a4fb2376147538 # v3.1.1
      with:
        install-only: 'true'

    # Run here, not in nuclei-action, so nuclei-skipped.sh can read its output (nuclei.log)
    - name: Nuclei Scan
      id: nuclei
      if: steps.preflight.outputs.nuclei == 'true' && steps.nuclei_install.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        URL: ${{ inputs.url }}
        RATE_LIMIT: ${{ inputs.nuclei_rate_limit }}
        CONCURRENCY: ${{ inputs.nuclei_concurrency }}
        TIMEOUT: ${{ inputs.nuclei_timeout }}
        RETRIES: ${{ inputs.nuclei_retries }}
        TAGS: ${{ steps.preflight.outputs.nuclei_tags }}
        TEMPLATES: ${{ steps.preflight.outputs.nuclei_templates }}
        SHARED_INPUTS: ${{ github.action_path }}/../shared/inputs.js
      run: |
        set -o pipefail
        # -nmhe keeps transient perimeter i/o timeouts from aborting the remaining templates
        args=(-u "$URL" -jsonl-export nuclei-results.jsonl -sarif-export nuclei-results.sarif
          -rl "$RATE_LIMIT" -c "$CONCURRENCY" -timeout "$TIMEOUT" -retries "$RETRIES" -nmhe)
        # Optional narrowing (options.sh); unset runs every template
        [[ -z "$TAGS" ]] || args+=(-tags "$TAGS")
        [[ -z "$TEMPLATES" ]] || args+=(-t "$TEMPLATES")
        # Same debug flags nuclei-action adds on a debug re-run
        if [[ "$(node "$SHARED_INPUTS" debug)" == true ]]; then
          args+=(-debug -verbose)
        fi
        nuclei "${args[@]}" 2>&1 | tee nuclei.log
        # A skipped target fails here, so a partial scan's SARIF can't close alerts
        bash "${GITHUB_ACTION_PATH}/nuclei-skipped.sh"

    - name: Convert ZAP Report to SARIF
      if: steps.preflight.outputs.zap == 'true' && hashFiles('report_json.json') != ''
      shell: bash
      run: jq -f "${GITHUB_ACTION_PATH}/zap-sarif.jq" report_json.json > zap-results.sarif

    - name: Upload ZAP SARIF
      if: steps.preflight.outputs.zap == 'true' && hashFiles('zap-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: zap-results.sarif
        category: zap-${{ steps.preflight.outputs.slug }}

    # Nuclei writes SARIF only when it has findings; an empty run closes stale alerts.
    # Nuclei <= v3.11.1 also omits ExecutionSuccessful on the invocation, serializing false.
    - name: Prepare Nuclei SARIF
      if: ${{ !cancelled() && steps.preflight.outputs.nuclei == 'true' && steps.nuclei.outcome == 'success' }}
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/nuclei-sarif.sh"

    # Only a complete scan uploads: a partial one would close alerts for templates that never ran
    - name: Upload Nuclei SARIF
      if: ${{ !cancelled() && steps.preflight.outputs.nuclei == 'true' && steps.nuclei.outcome == 'success' && hashFiles('nuclei-results.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: nuclei-results.sarif
        category: nuclei-${{ steps.preflight.outputs.slug }}

    # Findings never fail the action; a crashed scanner, missing report or
    # Nuclei skipping an unresponsive target (a failed Nuclei Scan step) does
    - name: Verify Scans Completed
      if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
      shell: bash
      env:
        ZAP_ENABLED: ${{ steps.preflight.outputs.zap }}
        NUCLEI_ENABLED: ${{ steps.preflight.outputs.nuclei }}
        ZAP_OUTCOME: ${{ steps.zap.outcome }}
        NUCLEI_OUTCOME: ${{ steps.nuclei.outcome }}
      run: bash "${GITHUB_ACTION_PATH}/verify.sh"
