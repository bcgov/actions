name: Workflow Results
description: Consolidate upstream job results into a single merge gate with summary table and annotations, and optionally notify on failure.
branding:
  icon: check-square
  color: blue

inputs:
  needs:
    description: Context from upstream jobs, passed via toJson(needs)
    required: true
  title:
    description: Header title for step summary and log output
    required: false
    default: 'Workflow Results'
  notify:
    description: >-
      Open or comment on a workflow-notifier issue when the gate fails.
      Empty (default) notifies on every event except pull_request and pull_request_target.
      Set true or false to override.
    required: false
    default: ''
  check_annotations:
    description: >-
      Fail the gate when a job in this run concluded success but has an error annotation
      (::error::, ##[error]) or GitHub's 'Unexpected input(s)' warning.
      Private and internal repos need actions: read and checks: read; without them the check is skipped with a warning.
      Set false to turn it off.
    required: false
    default: 'true'
  token:
    description: Token for the annotation check and notifications (defaults to github.token).
    required: false
    default: ${{ github.token }}

outputs:
  passed:
    description: >-
      'true' only when all upstream jobs passed or were skipped and the annotation check didn't fail;
      'false' otherwise, including when a job that concluded success has an error or 'Unexpected input(s)' annotation
    value: ${{ steps.gate.outputs.passed == 'true' && steps.annotations.outcome != 'failure' }}
  annotations:
    description: >-
      JSON array of the error and 'Unexpected input(s)' annotations found in jobs that concluded success
      ([] when none). Empty when the check is off or the token can't read annotations.
    value: ${{ steps.annotations.outputs.annotations }}

runs:
  using: composite
  steps:
    # Undeclared inputs fail here; GitHub only warns (input-enforcer/README.md)
    - name: Check inputs
      uses: $/input-enforcer
      with:
        inputs: ${{ toJSON(inputs) }}
        action_path: ${{ github.action_path }}

    - name: Evaluate job results
      id: gate
      continue-on-error: true
      shell: bash
      env:
        INPUT_NEEDS: ${{ inputs.needs }}
        INPUT_TITLE: ${{ inputs.title }}
      run: node "${{ github.action_path }}/index.js"

    - name: Check annotations
      id: annotations
      continue-on-error: true
      shell: bash
      env:
        INPUT_CHECK_ANNOTATIONS: ${{ inputs.check_annotations }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_TOKEN: ${{ inputs.token }}
      run: node "${{ github.action_path }}/annotations.js"

    - name: Resolve notify
      id: notify
      shell: bash
      env:
        INPUT_NOTIFY: ${{ inputs.notify }}
      run: node "${{ github.action_path }}/index.js" --resolve-notify

    - name: Checkout CODEOWNERS
      if: steps.notify.outputs.notify == 'true' && ((steps.gate.outcome == 'failure' && steps.gate.outputs.cancelled_only != 'true') || steps.annotations.outcome == 'failure')
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: .workflow-results-notify
        token: ${{ inputs.token }}
        persist-credentials: false
        sparse-checkout: |
          CODEOWNERS
          .github/CODEOWNERS
          .github/codeowners
          docs/CODEOWNERS
        sparse-checkout-cone-mode: false

    - name: Notify on failure
      if: steps.notify.outputs.notify == 'true' && ((steps.gate.outcome == 'failure' && steps.gate.outputs.cancelled_only != 'true') || steps.annotations.outcome == 'failure')
      shell: bash
      working-directory: .workflow-results-notify
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_TITLE: 'fix: failure in ${{ github.workflow }}'
        INPUT_BODY: ''
        INPUT_NOTIFY_AUTHOR: 'true'
        INPUT_NOTIFY_CODEOWNERS: fallback
        INPUT_EVENT_NAME: ${{ github.event_name }}
        INPUT_DRY_RUN: 'false'
      run: '"${{ github.action_path }}/../workflow-notifier/action.sh"'

    - name: Fail gate
      if: steps.gate.outcome == 'failure' || steps.annotations.outcome == 'failure'
      shell: bash
      run: |
        echo "::error::Workflow results gate failed"
        exit 1
