name: Get PR Number
description: Get PR number for merge queues, squash merges, and releases
branding:
  icon: package
  color: blue

inputs:
  debug:
    description: Enable debug logging
    default: "false"
  token:
    description: 'Authentication token (defaults to github.token; override with PAT if needed).'
    default: ${{ github.token }}
  github_token:
    description: 'Deprecated name for `token`, kept so bcgov/action-get-pr callers can switch without edits. When set, it is used instead of `token`.'

outputs:
  pr:
    description: "Associated pull request number"

runs:
  using: node24
  main: index.js
