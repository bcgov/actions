name: Get PR Number
description: Get PR number for merge queues, squash merges, and releases
branding:
  icon: git-pull-request
  color: blue

inputs:
  debug:
    description: Enable debug logging
    default: "false"
  token:
    description: 'Authentication token (defaults to github.token; override with PAT if needed).'
    default: ${{ github.token }}
    required: false

outputs:
  pr:
    description: "Associated pull request number"

runs:
  using: node24
  main: index.js
