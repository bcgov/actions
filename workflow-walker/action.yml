name: 'Workflow Walker'
description: 'Forensic Git-history walker for multi-image deployments.'

inputs:
  images:
    description: 'Component to image base name mapping (e.g. "frontend=ghcr.io/bcgov/vexilon-web backend=ghcr.io/bcgov/vexilon-api")'
    required: true
  token:
    description: 'GitHub token (defaults to github.token)'
    default: '${{ github.token }}'
  max_depth:
    description: 'Max commits to walk back'
    default: '1000'
  debug:
    description: 'Enable debug logging'
    default: 'false'

outputs:
  bundle_shas:
    description: 'A space-separated list of COMPONENT=SHA mappings'
    value: ${{ steps.walk.outputs.bundle_shas }}

runs:
  using: 'composite'
  steps:
    - name: Setup Crane
      uses: imjasonh/setup-crane@v0.4

    - name: Walk History
      id: walk
      shell: bash
      env:
        INPUT_IMAGES: "${{ inputs.images }}"
        INPUT_MAX_DEPTH: "${{ inputs.max_depth }}"
        INPUT_DEBUG: "${{ inputs.debug }}"
        INPUT_TOKEN: "${{ inputs.token }}"
      run: |
        "${{ github.action_path }}/action.sh"
