name: DAST
description: Run ZAP and Nuclei against one URL and upload SARIF to the Security tab
branding:
  icon: shield
  color: blue

inputs:
  target:
    description: |
      URL to scan with both ZAP and Nuclei.
      Defaults to the repository's Silver test route.
    default: https://${{ github.event.repository.name }}-test.apps.silver.devops.gov.bc.ca

outputs:
  zap_json:
    description: ZAP JSON report, relative to the workspace
    value: report_json.json
  nuclei_jsonl:
    description: Nuclei JSONL findings, relative to the workspace
    value: nuclei-results.jsonl

runs:
  using: composite
  steps:
    - name: Preflight
      id: preflight
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        if [[ ! "$TARGET" =~ ^https?://[[:alnum:]][^[:space:]]*$ ]]; then
          echo "::error::target must be an http(s) URL without whitespace, got '${TARGET}'"
          exit 1
        fi
        # Stale reports from an earlier run would make a broken scan look clean
        rm -f report_json.json zap-results.sarif nuclei-results.jsonl nuclei-results.sarif
        if [[ -f tests/.zap/rules.tsv ]]; then
          echo "zap_rules=tests/.zap/rules.tsv" >> "$GITHUB_OUTPUT"
        fi

    - name: ZAP Full Scan
      id: zap
      continue-on-error: true
      uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
      with:
        target: ${{ inputs.target }}
        rules_file_name: ${{ steps.preflight.outputs.zap_rules }}

    - name: Nuclei Scan
      id: nuclei
      continue-on-error: true
      uses: projectdiscovery/nuclei-action@cc153d0541e1adf8a42bbe31c0a4fb2376147538 # v3.1.1
      with:
        args: -u ${{ inputs.target }} -jsonl-export nuclei-results.jsonl -sarif-export nuclei-results.sarif

    - name: Convert ZAP Report to SARIF
      if: hashFiles('report_json.json') != ''
      shell: bash
      run: jq -f "${GITHUB_ACTION_PATH}/zap-sarif.jq" report_json.json > zap-results.sarif

    - name: Upload ZAP SARIF
      if: hashFiles('zap-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: zap-results.sarif
        category: zap

    # Nuclei writes SARIF only when it has findings
    - name: Upload Nuclei SARIF
      if: hashFiles('nuclei-results.sarif') != ''
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: nuclei-results.sarif
        category: nuclei

    # Findings never fail the action; a crashed scanner or missing report does
    - name: Verify Scans Completed
      if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
      shell: bash
      env:
        ZAP_OUTCOME: ${{ steps.zap.outcome }}
        NUCLEI_OUTCOME: ${{ steps.nuclei.outcome }}
      run: |
        rc=0
        if [[ "$ZAP_OUTCOME" != success || ! -f report_json.json ]]; then
          echo "::error::ZAP did not complete: step ${ZAP_OUTCOME}, report_json.json $([[ -f report_json.json ]] && echo present || echo missing)"
          rc=1
        fi
        if [[ "$NUCLEI_OUTCOME" != success || ! -f nuclei-results.jsonl ]]; then
          echo "::error::Nuclei did not complete: step ${NUCLEI_OUTCOME}, nuclei-results.jsonl $([[ -f nuclei-results.jsonl ]] && echo present || echo missing)"
          rc=1
        fi
        exit "$rc"
