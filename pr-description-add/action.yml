name: 'Add to PR Descriptions'
description: 'Add markdown content to a pull request description.'
branding:
  icon: 'plus'
  color: 'blue'

inputs:
  add_markdown:
    description: 'Markdown message to append to the PR description'
    required: true
  github_token:
    description: 'GitHub token with PR write access'
    default: ${{ github.token }}

outputs:
  pr_number:
    description: 'The pull request number updated'
    value: ${{ steps.update.outputs.pr_number }}

runs:
  using: 'composite'
  steps:
    - id: update
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        MARKDOWN: ${{ inputs.add_markdown }}
      run: "${{ github.action_path }}/action.sh"
